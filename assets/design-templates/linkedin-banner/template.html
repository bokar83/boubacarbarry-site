<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>LinkedIn Banner Template</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     EDIT ZONE — change the words here, nothing else, to reuse
     this template for a new banner. Line 1 / Line 2 / Line 3 are
     the headline (line 3 is the orange line), CTA_LABEL is the
     button text, CTA_URL is the text to the right of the button.
     ============================================================ */
  :root{
    --line1: "Your";
    --line2: "constraint";
    --line3-a: "has a";
    --line3-b: "name.";
    --cta-label: "Let’s find it.";
    --cta-url: "catalystworks.consulting";
  }

  @font-face {
    font-family: 'Poppins';
    src: local('Poppins ExtraBold'), local('Poppins-ExtraBold');
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 1584px;
    height: 396px;
    overflow: hidden;
  }

  body {
    position: relative;
    width: 1584px;
    height: 396px;
    background:
      radial-gradient(120% 160% at 34% 45%, #1F5C63 0%, #16474C 42%, #0E363B 78%, #0A2C30 100%);
    font-family: 'Poppins', 'Archivo Black', 'Arial Black', sans-serif;
    color: #F2EEE3;
  }

  /* Left-side geometric line/diamond texture -- faint repeating pattern */
  .pattern {
    position: absolute;
    top: 0; left: 0;
    width: 760px;
    height: 396px;
    opacity: 0.11;
    background-image: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='120' height='120' viewBox='0 0 120 120'%3E%3Crect x='8' y='14' width='34' height='4' fill='%23EAF3F2'/%3E%3Crect x='70' y='30' width='24' height='4' fill='%23EAF3F2'/%3E%3Crect x='6' y='60' width='26' height='4' fill='%23EAF3F2'/%3E%3Crect x='66' y='78' width='30' height='4' fill='%23EAF3F2'/%3E%3Crect x='10' y='100' width='22' height='4' fill='%23EAF3F2'/%3E%3Cpath d='M100 8 L108 16 L100 24 L92 16 Z' fill='%23EAF3F2'/%3E%3Cpath d='M46 46 L54 54 L46 62 L38 54 Z' fill='%23EAF3F2'/%3E%3Cpath d='M100 90 L108 98 L100 106 L92 98 Z' fill='%23EAF3F2'/%3E%3Cpath d='M60 4 L68 10 L60 16 L52 10 Z' fill='none' stroke='%23EAF3F2' stroke-width='2'/%3E%3C/svg%3E");
    background-repeat: repeat;
    background-size: 120px 120px;
  }

  .headline {
    position: absolute;
    right: 64px;
    top: 34px;
    text-align: right;
    line-height: 1.02;
  }

  .headline .row {
    font-weight: 800;
    font-size: 66px;
    letter-spacing: -0.5px;
    white-space: nowrap;
  }

  .headline .row.cream { color: #F2EEE3; }
  .headline .row.orange { color: #EFA13B; }

  .cta {
    position: absolute;
    right: 64px;
    top: 256px;
    display: flex;
    align-items: center;
    gap: 18px;
  }

  .cta .btn {
    background: #EFA13B;
    color: #16292C;
    font-weight: 700;
    font-size: 27px;
    padding: 14px 26px;
    border-radius: 6px;
    white-space: nowrap;
  }

  .cta .url {
    color: #F2EEE3;
    font-weight: 600;
    font-size: 24px;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="pattern"></div>
  <div class="headline">
    <div class="row cream" id="h1"></div>
    <div class="row cream" id="h2"></div>
    <div class="row orange" id="h3"></div>
  </div>
  <div class="cta">
    <div class="btn" id="cta-label"></div>
    <div class="url" id="cta-url"></div>
  </div>

  <script>
    // Pulls the words from the CSS custom properties above so the
    // ONLY place a future edit needs to touch is the :root block.
    function cssVar(name) {
      var raw = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      return raw.replace(/^"|"$/g, '').replace(/\\u2019/g, '’');
    }
    document.getElementById('h1').textContent = cssVar('--line1');
    document.getElementById('h2').textContent = cssVar('--line2');
    document.getElementById('h3').textContent = cssVar('--line3-a') + ' ' + cssVar('--line3-b');
    document.getElementById('cta-label').textContent = cssVar('--cta-label');
    document.getElementById('cta-url').textContent = cssVar('--cta-url');
  </script>
</body>
</html>
