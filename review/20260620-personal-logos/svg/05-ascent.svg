<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="The Operator / Ascent mark">
  <defs>
    <linearGradient id="ascLine" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#2ad4df"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <!-- a constellation of nodes rising = a system, an operator, ascent -->
  <!-- connective edges -->
  <g stroke="url(#ascLine)" stroke-width="2.2" stroke-linecap="round" fill="none" stroke-opacity="0.95">
    <path d="M14 50 L 26 38"/>
    <path d="M26 38 L 38 44"/>
    <path d="M38 44 L 50 18"/>
    <path d="M26 38 L 40 26"/>
  </g>
  <!-- faint secondary lattice (the system running quietly) -->
  <g stroke="#2ad4df" stroke-width="1.2" stroke-opacity="0.22" fill="none">
    <path d="M14 50 L 38 44"/>
  </g>
  <!-- nodes -->
  <g fill="#10131b" stroke="#2ad4df" stroke-width="2.2">
    <circle cx="14" cy="50" r="4"/>
    <circle cx="26" cy="38" r="4"/>
    <circle cx="38" cy="44" r="4"/>
    <circle cx="40" cy="26" r="3.4"/>
  </g>
  <!-- the apex node: the goal reached, amber -->
  <circle cx="50" cy="18" r="5.4" fill="#fbbf24"/>
  <circle cx="50" cy="18" r="5.4" fill="none" stroke="#fde68a" stroke-width="1.2"/>
  <!-- clay underline: the ground / foundation -->
  <line x1="10" y1="56" x2="54" y2="56" stroke="#d9a07e" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7"/>
</svg>
