<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="The Baobab mark">
  <defs>
    <linearGradient id="baoTrunk" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#d9a07e"/>
      <stop offset="55%" stop-color="#2ad4df"/>
      <stop offset="100%" stop-color="#2ad4df"/>
    </linearGradient>
  </defs>
  <!-- amber sun rising behind the tree -->
  <circle cx="32" cy="26" r="17" fill="#fbbf24" fill-opacity="0.14"/>
  <circle cx="32" cy="26" r="17" fill="none" stroke="#fbbf24" stroke-width="1.4" stroke-opacity="0.45"/>
  <!-- baobab silhouette: fat tapering trunk + iconic splayed bare canopy -->
  <g fill="none" stroke="url(#baoTrunk)" stroke-linecap="round" stroke-linejoin="round">
    <!-- trunk: thick, tapering -->
    <path d="M32 50 C 30.5 44, 31 38, 32 32" stroke-width="6"/>
    <!-- primary canopy limbs -->
    <path d="M32 33 C 26 28, 19 27, 13 23" stroke-width="3.4"/>
    <path d="M32 33 C 38 28, 45 27, 51 23" stroke-width="3.4"/>
    <path d="M32 33 C 29 27, 25 23, 21 18" stroke-width="3"/>
    <path d="M32 33 C 35 27, 39 23, 43 18" stroke-width="3"/>
    <path d="M32 32 C 32 26, 32 21, 32 16" stroke-width="3"/>
    <!-- twiggy upper splits (baobab's bare-branch look) -->
    <path d="M13 23 l -3 -3 M13 23 l -2 4" stroke-width="2"/>
    <path d="M51 23 l 3 -3 M51 23 l 2 4" stroke-width="2"/>
    <path d="M21 18 l -2.5 -2.5 M21 18 l -3 1.5" stroke-width="2"/>
    <path d="M43 18 l 2.5 -2.5 M43 18 l 3 1.5" stroke-width="2"/>
    <path d="M32 16 l -2.5 -2 M32 16 l 2.5 -2" stroke-width="2"/>
  </g>
  <!-- roots flaring from the same trunk base (grounded heritage) -->
  <g fill="none" stroke="#d9a07e" stroke-width="3" stroke-linecap="round">
    <path d="M32 50 C 28 52, 24 53, 20 55"/>
    <path d="M32 50 C 36 52, 40 53, 44 55"/>
    <path d="M32 50 V 56"/>
  </g>
</svg>
