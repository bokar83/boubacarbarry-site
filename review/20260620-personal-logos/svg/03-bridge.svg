<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="The Bridge mark">
  <defs>
    <linearGradient id="brArc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2ad4df"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d9a07e"/>
    </linearGradient>
  </defs>
  <!-- two worlds: left disc and right disc -->
  <circle cx="12" cy="40" r="6" fill="none" stroke="#2ad4df" stroke-width="2.6"/>
  <circle cx="52" cy="40" r="6" fill="none" stroke="#d9a07e" stroke-width="2.6"/>
  <!-- the span: a single arc connecting them -->
  <path d="M12 34 C 22 14, 42 14, 52 34" fill="none" stroke="url(#brArc)" stroke-width="3.4" stroke-linecap="round"/>
  <!-- suspension lines -->
  <g stroke="#2ad4df" stroke-width="1.5" stroke-opacity="0.55">
    <line x1="20" y1="22.5" x2="20" y2="40"/>
    <line x1="26" y1="18.5" x2="26" y2="40"/>
    <line x1="38" y1="18.5" x2="38" y2="40"/>
    <line x1="44" y1="22.5" x2="44" y2="40"/>
  </g>
  <!-- the keystone node: where worlds meet (amber, the point) -->
  <circle cx="32" cy="16.5" r="4.4" fill="#10131b" stroke="#fbbf24" stroke-width="2.4"/>
  <circle cx="32" cy="16.5" r="1.4" fill="#fbbf24"/>
  <!-- deck line -->
  <line x1="6" y1="40" x2="58" y2="40" stroke="#d9a07e" stroke-width="2" stroke-linecap="round" stroke-opacity="0.85"/>
</svg>
