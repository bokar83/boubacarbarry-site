<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="The Griot's Voice mark">
  <defs>
    <linearGradient id="kStr" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#2ad4df"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <!-- The griot's kora reimagined as a rising voice / sound-bloom.
       Half calabash at the base, strings fanning up like sound or sunrise rays. -->
  <!-- enclosing arc: the sound carrying out -->
  <path d="M9 36 A 23 23 0 0 1 55 36" fill="none" stroke="#2ad4df" stroke-width="2.2" stroke-opacity="0.35"/>
  <!-- the calabash resonator (half gourd) -->
  <path d="M16 38 A 16 16 0 0 0 48 38 Z" fill="#d9a07e"/>
  <path d="M16 38 A 16 16 0 0 0 48 38" fill="none" stroke="#10131b" stroke-width="1.4" stroke-opacity="0.35"/>
  <!-- bridge line across the gourd -->
  <line x1="16" y1="38" x2="48" y2="38" stroke="#10131b" stroke-width="2" stroke-opacity="0.4"/>
  <!-- the rising strings / rays from a single point (the voice ascending) -->
  <g stroke="url(#kStr)" stroke-width="2" stroke-linecap="round" fill="none">
    <line x1="32" y1="38" x2="16" y2="20"/>
    <line x1="32" y1="38" x2="24" y2="14"/>
    <line x1="32" y1="38" x2="32" y2="11"/>
    <line x1="32" y1="38" x2="40" y2="14"/>
    <line x1="32" y1="38" x2="48" y2="20"/>
  </g>
  <!-- string tips -->
  <g fill="#fbbf24">
    <circle cx="16" cy="20" r="2"/>
    <circle cx="24" cy="14" r="2"/>
    <circle cx="32" cy="11" r="2.3"/>
    <circle cx="40" cy="14" r="2"/>
    <circle cx="48" cy="20" r="2"/>
  </g>
  <!-- the origin node (where the story starts) -->
  <circle cx="32" cy="38" r="3" fill="#10131b" stroke="#fbbf24" stroke-width="1.8"/>
</svg>
