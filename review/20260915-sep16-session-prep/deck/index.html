body{font-family:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;color:#E4E9DE}

#deck{position:fixed;inset:0}
.sheetwrap{position:absolute;inset:0;opacity:0;pointer-events:none;
           display:flex;align-items:center;justify-content:center;
           transition:opacity .16s linear}
.sheetwrap.on{opacity:1;pointer-events:auto;z-index:2}

.hud{position:fixed;right:14px;bottom:12px;z-index:60;font-family:'Azeret Mono',ui-monospace,monospace;
     font-size:11px;letter-spacing:.16em;color:var(--chrome-dim);pointer-events:none;
     background:rgba(8,12,22,.7);padding:5px 10px;border:1px solid var(--chrome-line);border-radius:3px}
.hint{position:fixed;left:14px;bottom:12px;z-index:60;font-family:'Azeret Mono',ui-monospace,monospace;
      font-size:11px;letter-spacing:.1em;color:var(--chrome-dim);pointer-events:none;
      background:rgba(8,12,22,.7);padding:5px 10px;border:1px solid var(--chrome-line);border-radius:3px}
.banner{position:fixed;left:50%;transform:translateX(-50%);top:10px;z-index:60;
        font-family:'Azeret Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.18em;
        text-transform:uppercase;color:#D2A94E;background:rgba(8,12,22,.78);
        padding:5px 12px;border:1px solid var(--chrome-line);border-radius:3px;pointer-events:none}
body.hidechrome .hud,body.hidechrome .hint,body.hidechrome .banner{display:none}

/* ===========================================================================
   PRESENTER LAYER. Only live when <html data-present="1">. The attendee file
   and the presenting file are the same document, one attribute apart, so the
   two can never drift the way a second hand-maintained copy would.
   ======================================================================== */
html[data-present="1"] .banner,
html[data-present="1"] .hint,
html[data-present="1"] .hud{display:none}
.pchrome{position:fixed;right:16px;bottom:18px;z-index:70;display:none;align-items:center;gap:14px;
  font-family:'Azeret Mono',ui-monospace,monospace;font-size:13px;letter-spacing:.14em;
  color:#D2A94E;background:rgba(8,12,22,.86);border:1px solid #2C3850;border-radius:4px;
  padding:7px 13px;opacity:0;transition:opacity .22s linear;pointer-events:none}
html[data-present="1"] .pchrome{display:flex}
.pchrome.show{opacity:1}
.pchrome .clk{color:#E9EEE3;font-weight:600;font-size:15px;letter-spacing:.08em}
.pchrome .clk.hide{display:none}
.pbar{position:fixed;left:0;bottom:0;height:3px;background:#D2A94E;z-index:71;width:0;
  transition:width .18s linear;display:none}
html[data-present="1"] .pbar{display:block}
.blankout{position:fixed;inset:0;z-index:990;background:#000;display:none}
.blankout.on{display:block}
.blankout.w{background:#fff}
body.grid .sheetwrap{cursor:pointer}

/* ===========================================================================
   PRINT. One sheet per page, at its true 1600x900, chrome off.
   ======================================================================== */
@media print{
  html,body{height:auto;overflow:visible;background:#fff}
  .banner,.hint,.hud,.pchrome,.pbar,.blankout{display:none !important}
  #deck{position:static}
  .sheetwrap{position:static !important;opacity:1 !important;display:block !important;
    width:1600px;height:900px;overflow:hidden;page-break-after:always;break-after:page;
    transition:none !important}
  .sheetwrap:last-child{page-break-after:auto;break-after:auto}
  /* relative, NOT static: the sheet content is absolutely positioned against
     the stage. Making the stage static removes the containing block and every
     sheet's copy resolves against the page instead, piling all 36 onto page 1
     and leaving the rest as empty grounds. */
  .sheetwrap .stage{position:relative !important;transform:none !important}
  /* MEASURED, twice, because the first measurement was wrong. The previous deck
     hit 15.9 MB from a film grain feTurbulence filter, which has no vector form
     and flattened every slide to a full page RGBA bitmap. This deck carries no
     filter, but the six warped strips and the weave are repeating gradients and
     those flatten too: printed with the strips it is 5.25 MB, with the strips
     resolved to their solid dye colour it is 802 KB. So the ground prints flat.
     The panel, the drawings, the rules and the type are solid boxes and stay
     vector, so the sheet still reads as itself and the text stays selectable.
     Any filter added to a sheet later must be killed here too. */
  .H *{filter:none !important;-webkit-filter:none !important}
  .H .ground i{background-image:none !important}
  .H .vatline{opacity:.5}
  .H .weave{background-image:none !important;background:rgba(143,165,206,.30) !important}
  .H.res .weave{background-image:none !important;background:rgba(34,64,124,.30) !important}
  .H .hatch{background-image:none !important;background:rgba(160,160,160,.18) !important}
}

/* contact sheet mode: every sheet at once, for review and for screenshots */
body.grid{overflow:auto}
body.grid #deck{position:static;display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));
                gap:16px;padding:16px}
body.grid .sheetwrap{position:relative;inset:auto;opacity:1;pointer-events:auto;display:block;
                     width:100%;aspect-ratio:16/9;overflow:hidden;border:1px solid var(--chrome-line)}
body.grid .hud,body.grid .hint{display:none}

/* ===========================================================================
   THE SHEET SYSTEM
   ISO 128-2:2020 line weights. The 1600 px stage is an A3 landscape sheet,
   420 mm wide, so 1 mm = 3.81 px. Strip module 266.667 px = 220 mm at 1:20.
   ======================================================================== */
.stage{
  --lw018:0.69px; --lw025:0.95px; --lw035:1.33px; --lw05:1.90px;
  --lw07:2.67px;  --lw10:3.81px;  --lw14:5.33px;  --lw20:7.62px;
  --strip:266.667px;
  width:1600px;height:900px;position:relative;overflow:hidden;
  transform-origin:center center;flex:none}
.stage *{box-sizing:border-box}

/* ------------------------------------------------------------- VAT GROUND */
.H{
  --stock:#16305E;      /* leppi indigo, four baths */
  --flat:#12274F;       /* the same dye, undisturbed: inside the held field */
  /* THREE ROLES, THREE COLOURS, NO OVERLAP.
     ink   the lettering. Headlines and body. Never anything else.
     weave the subject being drawn. Strips, motifs, section. Never a letter.
     mark  what a draughtsman adds on top. Figure numbers, callouts, leaders,
           dimensions, PLAN and SECTION labels. Never body copy. */
  --ink:#E9EEE3;        /* cotton lettering */
  --indigo:#8FA5CE;     /* the weave, on the vat ground */
  --oxide:#D2A94E;      /* Fulani brass, the annotation mark */
  --thin:rgba(228,233,222,.50);
  --faint:rgba(228,233,222,.22);
  --tbbg:rgba(22,48,94,.90);
  background:var(--stock);color:var(--ink);font-family:'Archivo',sans-serif}

/* six strips, full bleed. Each was warped separately so no two share a stripe
   pitch. This is the surface of the cloth, not a texture laid over a design. */
.H .ground{position:absolute;inset:0;display:grid;grid-template-columns:repeat(6,1fr);z-index:0}
.H .ground i{border-right:1px solid rgba(6,12,28,.55)}
.H .ground i:last-child{border-right:0}
.H .ground i:nth-child(1){background-image:repeating-linear-gradient(to right,rgba(228,233,222,.085) 0 1px,transparent 1px 7px)}
.H .ground i:nth-child(2){background-image:repeating-linear-gradient(to right,rgba(228,233,222,.062) 0 1px,transparent 1px 9px)}
.H .ground i:nth-child(3){background-image:repeating-linear-gradient(to right,rgba(228,233,222,.100) 0 1px,transparent 1px 6px)}
.H .ground i:nth-child(4){background-image:repeating-linear-gradient(to right,rgba(228,233,222,.048) 0 1px,transparent 1px 11px)}
.H .ground i:nth-child(5){background-image:repeating-linear-gradient(to right,rgba(228,233,222,.090) 0 1px,transparent 1px 8px)}
.H .ground i:nth-child(6){background-image:repeating-linear-gradient(to right,rgba(228,233,222,.070) 0 1px,transparent 1px 10px)}
.H .vatline{position:absolute;left:0;right:0;height:2px;background:rgba(228,233,222,.10);z-index:0}

/* THE HELD FIELD. Bound off before the vat, so the dye never reached it: the
   stripes and the vat lines stop at its edge and the ground inside goes flat.
   One per sheet. Nothing but the message is allowed in it. */
.H .held{position:absolute;background:var(--flat);z-index:1}
.H .tick{position:absolute;background:var(--ink);opacity:.62;z-index:3}

/* --------------------------------------------------------- RESERVE GROUND
   The sheet the dye never reached at all. One token flip, no new drawing and
   no new type. It lands on the sheets the deck already ran dark. */
.H.res{
  --stock:#E7E3D6;
  --flat:#E7E3D6;
  --ink:#101A31;        /* near black. All lettering on cream. */
  --indigo:#22407C;     /* the weave, on the cream ground */
  --oxide:#A9552B;      /* drafting red oxide, the annotation mark */
  --thin:rgba(19,31,62,.52);
  --faint:rgba(19,31,62,.24);
  --tbbg:rgba(231,227,214,.92)}

/* ----------------------------------------------------------- apparatus */
.H .sheetborder{position:absolute;inset:26px;border:var(--lw14) solid var(--ink);z-index:2}
.H .sheetborder.thin{border-width:var(--lw035);border-color:var(--thin)}
.H .sheetinner{position:absolute;inset:58px;border:var(--lw018) solid var(--faint);z-index:2}
.H .zone{position:absolute;font-family:'Azeret Mono',monospace;font-size:14px;font-weight:600;
  color:var(--oxide);opacity:.75;z-index:4}
.H .ztick{position:absolute;background:var(--thin);z-index:4}
.H .titleblock{position:absolute;right:58px;bottom:58px;width:498px;border:var(--lw07) solid var(--ink);
  background:var(--tbbg);display:grid;grid-template-columns:repeat(3,1fr);z-index:6}
.H .titleblock div{border-right:var(--lw018) solid var(--thin);border-bottom:var(--lw018) solid var(--thin);
  padding:8px 10px 9px}
.H .titleblock div:nth-child(3n){border-right:none}
.H .titleblock div:nth-last-child(-n+3){border-bottom:none}
.H .titleblock span{display:block;font-family:'Azeret Mono',monospace;font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--oxide);opacity:.9;margin-bottom:3px}
.H .titleblock b{display:block;font-family:'Azeret Mono',monospace;font-size:14px;font-weight:600;
  letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.H .tbwide{grid-column:1 / -1}

/* ---------------------------------------------------------------- type
   figtitle never wraps. Every line break in a headline is a decision, which
   is the only way to guarantee no headline ever drops one word on its own. */
.H .figtitle{position:absolute;font-family:'Anybody',sans-serif;font-variation-settings:'wdth' 88,'wght' 750;
  text-transform:uppercase;letter-spacing:-.008em;line-height:.94;margin:0;color:var(--ink);z-index:4;
  white-space:nowrap}
.H .figno{position:absolute;font-family:'Azeret Mono',monospace;font-size:17px;font-weight:600;
  letter-spacing:.2em;color:var(--oxide);z-index:4;white-space:nowrap}
.H .keytxt{position:absolute;font-size:36px;line-height:1.34;color:rgba(228,233,222,.90);z-index:4}
.H .keytxt.big{font-size:44px;line-height:1.3;font-weight:600;color:#F7F9F2}
.H.res .keytxt{color:var(--ink)}
.H.res .keytxt.big{color:var(--ink);font-weight:600}
.H .keytxt b{font-weight:700;color:#FFFFFF}
.H.res .keytxt b{color:var(--ink)}
.H .regkey{position:absolute;font-family:'Azeret Mono',monospace;font-size:22px;font-weight:600;
  letter-spacing:.04em;color:var(--oxide);line-height:1.25;z-index:4}
.H .note{position:absolute;font-family:'Azeret Mono',monospace;font-size:14px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--oxide);opacity:.9;z-index:4}

/* ------------------------------------------- content sheets, in document flow */
.H .flow{position:absolute;z-index:4}
.H .flow p{margin:0}
.H .flow .r07{height:var(--lw07);background:var(--ink);width:520px;margin:0 0 26px}
.H .flow .lead{font-size:40px;line-height:1.28;font-weight:600;color:#F7F9F2;margin:0 0 30px}
.H.res .flow .lead{color:var(--ink)}
.H .flow .para{font-size:34px;line-height:1.34;color:rgba(228,233,222,.90);margin:0 0 26px}
.H.res .flow .para{color:var(--ink)}
.H .flow .close{font-size:34px;line-height:1.3;font-weight:600;color:#F7F9F2;margin:6px 0 0}
.H.res .flow .close{color:var(--ink)}
.H .flow b,.H .flow strong{font-weight:700;color:#FFFFFF}
.H.res .flow b,.H.res .flow strong{color:var(--ink)}

.H .flow .sched{border-top:var(--lw07) solid var(--ink);margin:0 0 22px}
.H .flow .sched .row{display:flex;gap:30px;align-items:baseline;padding:12px 0 13px;
  border-bottom:var(--lw018) solid var(--faint)}
.H .flow .sched .row b{flex:none;font-family:'Azeret Mono',monospace;font-size:22px;font-weight:600;
  letter-spacing:.04em;color:var(--oxide)}
.H .flow .sched .row span{font-size:32px;line-height:1.3;color:rgba(228,233,222,.92)}
.H.res .flow .sched .row span{color:var(--ink)}

.H .flow .twin{display:grid;grid-template-columns:1fr 1fr;gap:0 84px;margin:0 0 24px}
.H .flow .colh{font-family:'Azeret Mono',monospace;font-size:21px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;opacity:.62;margin:0 0 10px}
.H .flow .colh.no{color:var(--oxide);opacity:1}
.H .flow .twin .r07{width:100%;margin:0 0 8px}
.H .flow .trow{font-size:30px;line-height:1.28;padding:14px 0 15px;
  border-bottom:var(--lw018) solid var(--faint);color:rgba(228,233,222,.92)}
.H.res .flow .trow{color:var(--ink)}

.H .flow .op{display:flex;gap:26px;align-items:flex-start;margin:0 0 18px}
.H .flow .op i{flex:none;width:36px;height:36px;border:var(--lw05) solid var(--oxide);border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-family:'Azeret Mono',monospace;
  font-size:17px;font-weight:600;font-style:normal;color:var(--oxide);margin-top:6px}
.H .flow .op span{font-size:36px;line-height:1.28;color:rgba(228,233,222,.92)}
.H.res .flow .op span{color:var(--ink)}

/* The specification block. Set as individual lines rather than one wrapping
   paragraph: a prompt is a document with a line structure, and a line that
   wraps on its own reads as a line the author did not write. Nothing wraps,
   and the blank lines between passes are a 14 px rule of space instead of a
   whole empty line, which is what buys the type its size back. */
.H .flow .specbox{border:var(--lw07) solid var(--ink);padding:14px 13px 16px;
  background:rgba(19,31,62,.55)}
.H.res .flow .specbox{background:rgba(231,227,214,.72)}
.H .flow .specbox .ln{font-family:'Azeret Mono',monospace;font-size:22px;line-height:1.30;
  white-space:nowrap;color:var(--ink)}
.H .flow .specbox .ln b{color:var(--oxide);font-weight:600}
.H .flow .specbox .gap{height:10px}

/* the address line. A URL is a dimension: it is exact or it is wrong. */
.H .flow .url{font-family:'Azeret Mono',monospace;font-size:42px;font-weight:600;letter-spacing:.01em;
  color:var(--oxide);margin:0 0 26px;white-space:nowrap}
.H .flow .stanza{font-size:34px;line-height:1.34;color:rgba(228,233,222,.92);margin:0 0 26px}
.H.res .flow .stanza{color:var(--ink)}
.H .flow .stanza.strong{font-size:40px;line-height:1.28;font-weight:600;color:#F7F9F2}
.H.res .flow .stanza.strong{color:var(--ink)}
.H .flow .contact{font-family:'Azeret Mono',monospace;font-size:24px;line-height:1.5;
  letter-spacing:.02em;color:var(--oxide);margin:20px 0 0}

/* --------------------------------------------------- drawing apparatus */
.H .spec-h,.H .spec-v{position:absolute;background:var(--indigo);z-index:4}
.H .motif{position:absolute;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);z-index:4}
.H .hatch{position:absolute;z-index:4;
  background:repeating-linear-gradient(45deg,var(--thin) 0 1px,transparent 1px 7px)}
.H .dimline{position:absolute;height:var(--lw025);background:var(--oxide);opacity:.85;z-index:4}
.H .slash{position:absolute;width:var(--lw05);height:15px;background:var(--oxide);opacity:.85;
  transform:rotate(45deg);z-index:4}
.H .ext{position:absolute;width:var(--lw018);background:var(--oxide);opacity:.55;z-index:4}
.H .dimtxt{position:absolute;font-family:'Azeret Mono',monospace;font-size:14px;font-weight:500;
  letter-spacing:.05em;color:var(--oxide);background:var(--stock);padding:0 6px;z-index:4}
.H .ref{position:absolute;width:36px;height:36px;border:var(--lw05) solid var(--oxide);border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-family:'Azeret Mono',monospace;font-size:17px;
  font-weight:600;color:var(--oxide);background:var(--stock);z-index:5}
.H .lead-h{position:absolute;height:var(--lw025);background:var(--oxide);opacity:.85;z-index:4}
.H .lead-v{position:absolute;width:var(--lw025);background:var(--oxide);opacity:.85;z-index:4}
.H .dot{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--oxide);z-index:5}
/* warp and weft. Whole pixel widths: 0.69 px hairlines alias in and out across
   a wide fill and the section reads as two different materials. */
.H .weave{position:absolute;z-index:4;
  background-image:repeating-linear-gradient(to right,var(--indigo) 0 1px,transparent 1px 9px),
                   repeating-linear-gradient(to bottom,var(--indigo) 0 1px,transparent 1px 15px);
  opacity:.72}
/* a scan target is a real detail with a real dimension. The code sits on the
   reserve, because the reserve is the part of the cloth you can write on. */
.H .qrplate{position:absolute;z-index:5;background:#E7E3D6;border:var(--lw07) solid var(--ink);padding:12px}
.H .qrplate img{display:block;width:100%;height:100%;image-rendering:pixelated}

/* the standing-order panel on the holding sheet. Same furniture as a title
   block, because that is exactly what it is: fixed facts about this sheet. */
.H .facts{position:absolute;border:var(--lw07) solid var(--ink);background:var(--tbbg);z-index:6;
  display:grid;grid-template-columns:1fr}
.H .facts div{border-bottom:var(--lw018) solid var(--thin);padding:10px 14px 11px}
.H .facts div:last-child{border-bottom:none}
.H .facts span{display:block;font-family:'Azeret Mono',monospace;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--oxide);margin-bottom:4px}
.H .facts b{display:block;font-family:'Azeret Mono',monospace;font-size:22px;font-weight:600;
  letter-spacing:.02em;color:var(--ink)}
</style>
</head>

<div id="deck"></div>
<div class="hint">&larr; &rarr; move &middot; F fullscreen &middot; G contact sheet</div>
<div class="hud" id="hud">01 / 36</div>
<div class="pbar" id="pbar"></div>
<div class="pchrome" id="pchrome"><span id="pcount">01 / 36</span><span class="clk hide" id="pclock">00:00</span></div>
<div class="blankout" id="blankout"></div>

<script>
/* ==========================================================================
   THE SHEETS. Copy carried over from the 2026-07-30 attendee deck, with the

/* ---------------------------------------------------------------- helpers */
/* RESERVE is the cloth the dye never reached. It is the interruption, so it is
   spent deliberately: a real turn in the session, or a sheet too dense to sit
   on indigo. Eight of thirty six. Declared per sheet with ground:'reserve',
   never inferred from the layout, because a section plate is not automatically
   a turn and a turn is not automatically a section plate. */
function isReserve(s){ return s.ground === 'reserve'; }

/* The full plate, meaning heavy border, zone letters and the seven cell title
   block. This follows the LAYOUT, not the ground, so flipping a colour never
   changes the furniture on the sheet. */
function isFullPlate(s){
  return s.t === 'res' || s.t === 'writedown' || s.t === 'contact' || s.t === 'cover';
}

function d(cls, style, html){ return '<div class="'+cls+'" style="'+style+'">'+(html||'')+'</div>'; }

/* Everything a draughtsman drew goes inside this wrapper. It carries no layout
   of its own, it exists so "the drawing must stay out of the held field" is a
   checkable statement rather than a list of class names that drifts. */
function DWG(html){ return '<div class="dwg">' + html + '</div>'; }

/* NO ONE-WORD LINES. Standing design principle: a line never ends up carrying
   a single word on its own. Two words minimum, three where the three are short
   enough that binding them cannot push the line out of its box. Binding with
   a non-breaking space is the only fix that survives a copy edit, because it
   travels with the words instead of with a hand-placed break. */
function nw(html){
  if (!html) return html;
  var s = String(html), tail = '', m;
  while ((m = s.match(/(<\/[a-z]+>)\s*$/i))){ tail = m[1] + tail; s = s.slice(0, m.index); }
  var words = s.split(' ').filter(function(w){ return w !== ''; });
  if (words.length < 3) return html;
  var last3 = words.slice(-3).join(' ');
  var n = (words.length >= 8 && last3.replace(/<[^>]+>/g,'').length <= 22) ? 3 : 2;
  var head = words.slice(0, words.length - n).join(' ');
  var tailw = words.slice(words.length - n).join(' ');
  return head + ' ' + tailw + tail;
}

  o += d('dimtxt','left:'+(x+30)+'px;top:'+(y+h+31)+'px','220');

  o += d('dimtxt','left:'+(x+346)+'px;top:'+(y+h+73)+'px','6 &times; 220 = 1320');
  o += d('note','left:'+x+'px;top:'+(y+h+126)+'px','Sixth strip simpler woven &nbsp;&middot;&nbsp; Dimensions in millimetres');

function drawStack6(x, y, mirror){   /* the cloth turned. Six is the real strip

/* ----------------------------------------------------------- the held field

   reaches it: inside, the ground goes flat and every stripe and vat line

  cover:1424, res:900,  resWide:1364, notes:1060, schedule:1300,
  work:1300,  workDraw:840, spec:1322, stack6:940, bandkey:800,
  kit:930,    writedown:1200, contact:940
};
var HEIGHTS = {
  cover:440, res:566, resWide:566, notes:610, schedule:660,
  work:660,  spec:700, detail:706, kit:660, writedown:600, contact:600
};
function MEASURE_OF(s){

  if (s.t === 'work')   return s.draw ? MEASURE.workDraw : MEASURE.work;
  if (s.t === 'detail') return s.draw === 'stack6' ? MEASURE.stack6 : MEASURE.bandkey;
  return MEASURE[s.t] || MEASURE.notes;
}
function FIELD(s){
  var h = (s.t === 'res') ? HEIGHTS.res : (HEIGHTS[s.t] || HEIGHTS.notes);
  return {x:58, y:70, w: MEASURE_OF(s) + 60, h: h};
}
/* The held field is drawn on EVERY sheet, including the reserve, where its
   fill is the same colour as the stock and it reads as nothing. That is what
   lets one measurement pass govern every sheet type. */
function held(s){
  var f = FIELD(s), o = '';
  o += d('held','left:'+f.x+'px;top:'+f.y+'px;width:'+f.w+'px;height:'+f.h+'px');
  var T = 24;
  [[f.x, f.y, 1, 1], [f.x+f.w, f.y, -1, 1], [f.x, f.y+f.h, 1, -1], [f.x+f.w, f.y+f.h, -1, -1]]
    .forEach(function(c){
      var hx = c[2] > 0 ? c[0] : c[0]-T, vy = c[3] > 0 ? c[1] : c[1]-T;
      var bot = c[3] < 0 ? ' b' : '';
      o += d('tick'+bot,'left:'+hx+'px;top:'+c[1]+'px;width:'+T+'px;height:var(--lw035)');
      o += d('tick'+bot,'left:'+c[0]+'px;top:'+vy+'px;width:var(--lw035);height:'+T+'px');
    });
  return o;
}

/* --------------------------------------------------- the cross-field chain
   Annotation reading across the whole sheet, dimensioning the strip module the
   ground is actually built from. It BREAKS at the held field and picks up on
   the far side, which is how the sheet says the field is reserved. */
function dimChainAt(y, f){
  var o = '';
  var breaks = (f.y <= y && y <= f.y + f.h) ? [f.x - 16, f.x + f.w + 16] : null;
  var segs = breaks ? [[58, breaks[0]], [breaks[1], 1542]] : [[58, 1542]];
  segs.forEach(function(sg){
    if (sg[1] - sg[0] < 30) return;
    o += d('dimline','left:'+sg[0]+'px;top:'+y+'px;width:'+(sg[1]-sg[0])+'px');
  });
  [58, 324.67, 591.33, 858, 1124.67, 1391.33].forEach(function(x){
    if (breaks && x > breaks[0] - 8 && x < breaks[1] + 8) return;
    o += d('slash','left:'+(x-1)+'px;top:'+(y-7)+'px');
    o += d('ext','left:'+x+'px;top:'+(y-30)+'px;height:26px');
  });
  var widest = segs.reduce(function(a,b){ return (b[1]-b[0]) > (a[1]-a[0]) ? b : a; }, segs[0]);
  if (widest[1] - widest[0] < 240) return '';
  o += d('dimtxt','left:'+Math.round((widest[0]+widest[1])/2 - 88)+'px;top:'+(y-11)+'px','STRIP MODULE 266');
  return o;
}

/* -------------------------------------------------------------- apparatus */
function apparatusFull(s, i, total){
  var o = d('sheetborder','') + d('sheetinner','');
  o += d('ztick','left:26px;top:300px;width:32px;height:var(--lw018)');
  o += d('ztick','left:26px;top:600px;width:32px;height:var(--lw018)');
  o += d('ztick','left:566px;top:26px;width:var(--lw018);height:32px');
  o += d('ztick','left:1096px;top:26px;width:var(--lw018);height:32px');
  o += d('zone','left:38px;top:172px','A') + d('zone','left:38px;top:442px','B') + d('zone','left:38px;top:742px','C');
  o += d('zone','left:300px;top:34px','1') + d('zone','left:826px;top:34px','2') + d('zone','left:1346px;top:34px','3');
  var tb = s.tb || {};
  o += '<div class="titleblock">'
    + '<div class="tbwide"><span>Title</span><b>' + s.title.replace(/<br>/g,' ') + '</b></div>'

    + '</div>';

function apparatusQuiet(s, i, total){
  /* the border thins from 1.4 mm to 0.35 mm, the zone letters come off, and the
     title block collapses to one line along the foot. Same sheet, less furniture. */
  var o = d('sheetborder thin','');
  o += d('spec-h','left:88px;top:796px;width:1300px;height:var(--lw018);opacity:.5');
  o += d('note','left:88px;top:810px','SHEET ' + pad(i+1) + ' OF ' + total);
  o += d('note','left:756px;top:810px', s.sub || '');
  o += d('note','left:1400px;top:810px;width:112px;text-align:right','DRAWN BOUBACAR');
  return o;
}

function pad(n){ return (n < 10 ? '0' : '') + n; }

/* ------------------------------------------------------------ sheet bodies */
function head(s, topFig, topTitle){
  var o = d('figno','left:88px;top:'+topFig+'px', s.fig + (s.sub ? ' &nbsp;&middot;&nbsp; ' + s.sub : ''));
  o += d('figtitle','left:84px;top:'+topTitle+'px;font-size:'+s.ts+'px', s.title);
  return o;
}
function flowTop(s){
  var lines = (s.title.match(/<br>/g)||[]).length + 1;
  return Math.round(138 + lines * s.ts * 0.94 + 40);
}
/* Content sheets lay out in real document flow inside the held field. Hand
   computed row heights were quietly wrong every time the copy changed length,
   so the browser measures instead. */
function flow(s, w, inner){
  return d('flow','left:88px;top:'+flowTop(s)+'px;width:'+w+'px', inner);
}

function bodyNotes(s){
  var o = head(s, 96, 138), h = '<div class="r07"></div>';
  if (s.lead) h += '<p class="lead">' + nw(s.lead) + '</p>';
  (s.body||[]).forEach(function(p){ h += '<p class="para">' + nw(p) + '</p>'; });
  return o + flow(s, MEASURE_OF(s), h);
}

function bodySchedule(s){
  var o = head(s, 96, 138), h = '';
  if (s.lead) h += '<p class="lead">' + nw(s.lead) + '</p>';
  if (s.twin){
    h += '<div class="twin">' + s.twin.map(function(col){
      return '<div><p class="colh' + (col.no ? ' no' : '') + '">' + col.h + '</p>' +
             '<div class="r07"></div>' +
             col.rows.map(function(r){ return '<p class="trow">' + nw(r) + '</p>'; }).join('') +
             '</div>';
    }).join('') + '</div>';
  }
  if (s.reg){
    h += '<div class="sched">' + s.reg.map(function(r){
      return '<div class="row"><b style="width:' + (s.regw ? 380 : 110) + 'px">' + r[0] +
             '</b><span>' + nw(r[1]) + '</span></div>';
    }).join('') + '</div>';
  }
  if (s.parts){
    var two = s.parts.length > 6;
    var per = two ? Math.ceil(s.parts.length/2) : s.parts.length;
    var cols = two ? [s.parts.slice(0, per), s.parts.slice(per)] : [s.parts];
    h += '<div class="' + (two ? 'twin' : '') + '">' + cols.map(function(c, ci){
      return '<div class="sched">' + c.map(function(pt, i){
        var n = ci*per + i + 1;
        return '<div class="row"><b style="width:64px">' + pad(n) + '</b><span>' + nw(pt) + '</span></div>';
      }).join('') + '</div>';
    }).join('') + '</div>';
  }
  if (s.close) h += '<p class="close">' + nw(s.close) + '</p>';
  return o + flow(s, MEASURE_OF(s), h);
}

function bodyWork(s){
  var o = head(s, 96, 138), h = '';
  if (s.opsIntro) h += '<p class="para">' + nw(s.opsIntro) + '</p>';
  if (s.lead) h += '<p class="lead">' + nw(s.lead) + '</p>';
  (s.ops||[]).forEach(function(op, i){
    h += '<div class="op"><i>' + (i+1) + '</i><span>' + nw(op) + '</span></div>';
  });
  (s.body||[]).forEach(function(p){ h += '<p class="para">' + nw(p) + '</p>'; });
  if (s.close) h += '<div class="r07"></div><p class="close">' + nw(s.close) + '</p>';
  var draw = '';
  if (s.draw === 'qrcal') draw = DWG(drawScan(1090, 300, 300, QR_CAL, 'SCAN TARGET'));
  return o + flow(s, MEASURE_OF(s), h) + draw;
}

function bodySpec(s){
  /* The one sheet where the message IS a document, so the sheet gives it the
     whole plate: a small heading and then nothing but the specification. */
  var o = head(s, 92, 116);
  var lines = s.spec.map(function(l){
    return l === '' ? '<div class="gap"></div>' : '<div class="ln">' + l + '</div>';
  }).join('');
  return o + d('flow','left:88px;top:168px;width:'+MEASURE_OF(s)+'px',
    '<div class="specbox">' + lines + '</div>');
}

function bodyKit(s){
  /* The address is set as a dimension figure, in the annotation colour, at the
     size a dimension would be if a dimension mattered this much. It is the one
     thing on the sheet somebody has to type correctly. */
  var o = head(s, 96, 138), h = '';
  h += '<p class="url">' + s.url + '</p>';

    h += '<div class="op"><i>' + (i+1) + '</i><span>' + nw(op) + '</span></div>';

}

function bodyWriteDown(s){
  var o = head(s, 96, 140), h = '';
  s.stanzas.forEach(function(z){
    h += '<p class="stanza' + (z.s ? ' strong' : '') + '">' + nw(z.t) + '</p>';
  });

}

function bodyContact(s){
  var o = head(s, 96, 138), h = '';
  if (s.lead) h += '<p class="lead">' + nw(s.lead) + '</p>';
  h += '<div class="sched">' + s.rows.map(function(r){
    return '<div class="row"><b style="width:170px">' + r[0] + '</b><span>' + nw(r[1]) + '</span></div>';
  }).join('') + '</div>';

  return o + flow(s, MEASURE_OF(s), h) + DWG(drawScan(1120, 300, 280, QR_CAL, 'SCAN TARGET'));
}

function bodyDetail(s){
  /* The only sheet type that requires a drawing. Copy is the key to the figure,
     tied to it by a leader, because a reference numeral with no explanation is
     not allowed to exist. */
  var o = head(s, 96, 138);
  if (s.draw === 'stack6'){
    o += DWG(drawStack6(1240, 268, true));
    var ky = 250;
    s.keys.forEach(function(k){

      ky += 84;
    });
  } else if (s.draw === 'bandkey'){
    o += DWG(drawBand(1012, 316, 500, true)
      + d('dot','left:1039px;top:'+(316+59)+'px')
      + d('lead-h','left:952px;top:378px;width:90px')
      + d('lead-v','left:952px;top:302px;height:78px')
      + d('ref','left:934px;top:266px','1')
      + d('dot','left:1470px;top:'+(316+59)+'px')
      + d('lead-v','left:1473px;top:378px;height:314px')
      + d('lead-h','left:952px;top:690px;width:523px')
      + d('ref','left:934px;top:672px','2'));
    o += d('keytxt','left:88px;top:248px;width:'+MEASURE_OF(s)+'px;font-size:38px', nw(s.keys[0]));
    o += d('keytxt big','left:88px;top:490px;width:'+MEASURE_OF(s)+'px;font-size:40px', nw(s.keys[1]));
  }

function bodyCover(s){
  var o = d('figno','left:88px;top:96px', s.fig + ' &nbsp;&middot;&nbsp; ' + s.sub);
  o += d('figtitle','left:84px;top:136px;font-size:'+s.ts+'px', s.title);
  if (s.draw === 'ga6') o += DWG(drawGA6(88, 520));
  if (s.lead) o += d('keytxt big','left:920px;top:276px;width:600px;font-size:33px', nw(s.lead));
  if (s.opsIntro) o += d('keytxt','left:900px;top:146px;width:620px;font-size:31px', nw(s.opsIntro));
  if (s.ops){
    var y = 254;
    s.ops.forEach(function(op,i){
      o += d('ref','left:900px;top:'+(y-2)+'px', String(i+1));
      o += d('keytxt','left:956px;top:'+y+'px;width:566px;font-size:29px', nw(op));
      y += Math.ceil(op.length/44)*40 + 26;
    });
  }
  if (s.facts){
    o += '<div class="facts" style="left:88px;top:540px;width:640px">' +
      s.facts.map(function(f){ return '<div><span>'+f[0]+'</span><b>'+f[1]+'</b></div>'; }).join('') +
      '</div>';
  }
  return o;
}

function bodyRes(s){
  /* the blueprint. Full apparatus, because a section break is where the full
     plate earns its place. Ground and line invert; nothing else changes. */
  var o = head(s, 96, 140), h = '';
  h += '<div class="r07"></div>';
  if (s.lead) h += '<p class="lead">' + nw(s.lead) + '</p>';
  if (s.parts){
    h += '<div class="sched">' + s.parts.map(function(p,i){
      return '<div class="row"><b style="width:64px">' + pad(i+1) + '</b><span>' + nw(p) + '</span></div>';
    }).join('') + '</div>';
  }
  (s.body||[]).forEach(function(p){ h += '<p class="para">' + nw(p) + '</p>'; });
  if (s.close) h += '<p class="close">' + nw(s.close) + '</p>';
  var w = MEASURE_OF(s);
  var draw = '';
  if (s.draw === 'band') draw = DWG(drawBand(1092, 240, 420, true));
  if (s.draw === 'ga6')  draw = DWG(drawGA6(560, 430));
  return o + flow(s, w, h) + draw;
}

/* ------------------------------------------------------------------ render */
function renderSlide(s, i, total){
  s.fig = s.fig || ('FIG. ' + pad(i+1));
  var cls = 'stage H' + (isReserve(s) ? ' res' : '');
  var apparatus = isFullPlate(s) ? apparatusFull(s, i, total) : apparatusQuiet(s, i, total);
  var body = '';
  if (s.t === 'cover')          body = bodyCover(s);
  else if (s.t === 'res')       body = bodyRes(s);
  else if (s.t === 'notes')     body = bodyNotes(s);
  else if (s.t === 'schedule')  body = bodySchedule(s);
  else if (s.t === 'work')      body = bodyWork(s);
  else if (s.t === 'spec')      body = bodySpec(s);
  else if (s.t === 'detail')    body = bodyDetail(s);
  else if (s.t === 'kit')       body = bodyKit(s);
  else if (s.t === 'writedown') body = bodyWriteDown(s);
  else if (s.t === 'contact')   body = bodyContact(s);
  return '<div class="sheetwrap" id="s' + pad(i+1) + '"><div class="' + cls + '">' +
         ground(s) + apparatus + held(s) + body + '</div></div>';
}

/* Measure, then place. The held field is sized to the message the browser
   actually laid out, and the cross field chain only appears where there is
   real room for it below the field. */
function relayout(){
  var stages = document.querySelectorAll('#deck .stage');
  for (var i = 0; i < stages.length; i++){
    var st = stages[i], sl = SLIDES[i];
    var heldEl = st.querySelector('.held'), fl = st.querySelector('.flow');
    var f = FIELD(sl);
    /* A headline never wraps, so it cannot be trusted to stay inside anything.
       Measure it and step the size down until it sits within the measure. This
       is what let THINK OF ONE OWNER run 76 px out of its panel. */
    var kk = st.getBoundingClientRect().width / 1600 || 1;
    ['figtitle','figno'].forEach(function(cls){
      var el = st.querySelector('.' + cls);
      if (!el) return;
      var base = cls === 'figtitle' ? sl.ts : 17;
      el.style.fontSize = base + 'px';
      var avail = MEASURE_OF(sl);
      var wNow = el.getBoundingClientRect().width / kk;
      if (wNow > avail) el.style.fontSize = (base * Math.max(0.62, avail / wNow)).toFixed(2) + 'px';
    });
    var old = st.querySelector('.chain'); if (old) old.remove();
    var bottom = f.y + f.h;
    /* the specification sheet is given the whole plate down to the foot rule,
       because the document is the message and nothing else is on the sheet.
       The 664 stop is where the title block starts, so it follows the plate. */
    var maxBottom = sl.t === 'spec' ? 758 : (isFullPlate(sl) ? 664 : 726);
    if (fl && heldEl){
      var sr = st.getBoundingClientRect();
      var k = sr.width / 1600 || 1;
      fl.style.transform = 'none';
      var fr = fl.getBoundingClientRect();
      var topPx = Math.round((fr.top - sr.top) / k);
      var h = fr.height / k;
      var room = maxBottom - topPx;
      /* auto fit. If a sheet's copy genuinely will not sit in the field at full
         size it is scaled down, never allowed to run past the field edge. The
         floor is 0.82 rather than 0.90 because the old floor could not always
         reach and the panel was then clamped OVER the copy, which hid the
         overflow instead of preventing it. */
      var fit = h > room ? Math.max(0.82, room / h) : 1;
      fl.style.transformOrigin = 'top left';
      fl.style.transform = fit < 1 ? 'scale(' + fit.toFixed(4) + ')' : 'none';
      /* no clamp here. The panel covers whatever was actually laid out, so a
         miss shows up as a tall panel and gets caught, never as loose text. */
      bottom = Math.round(topPx + h * fit) + 26;
      heldEl.style.height = (bottom - f.y) + 'px';
      st.querySelectorAll('.tick.b').forEach(function(t){
        t.style.top = (t.style.width === '24px' ? bottom : bottom - 24) + 'px';
      });
    } else if (heldEl){
      /* Detail sheets place their keys against the drawing instead of running
         a flow, so there is nothing to measure a height from and the panel used
         to sit at its declared depth with a hole under the last line. Take the
         lowest thing actually in the panel and stop there. */
      var srD = st.getBoundingClientRect(), kD = srD.width / 1600 || 1, low = 0;
      st.querySelectorAll('.keytxt').forEach(function(el){
        low = Math.max(low, (el.getBoundingClientRect().bottom - srD.top) / kD);
      });
      if (low > 0) bottom = Math.round(low) + 30;
      heldEl.style.height = (bottom - f.y) + 'px';
      st.querySelectorAll('.tick.b').forEach(function(t){
        t.style.top = (t.style.width === '24px' ? bottom : bottom - 24) + 'px';
      });
    }
    if (isReserve(sl) || isFullPlate(sl) || sl.t === 'spec' || sl.draw) continue;
    var y = bottom + 30;
    if (y > 776) continue;
    var wrapEl = document.createElement('div');
    wrapEl.className = 'chain';
    wrapEl.innerHTML = dimChainAt(y, {x:f.x, y:f.y, w:f.w, h:bottom - f.y});
    st.appendChild(wrapEl);
  }
}

/* --------------------------------------------------------------- the frame */
var TOTAL = SLIDES.length;
var idx = 0;

function fit(){
  var vw = window.innerWidth, vh = window.innerHeight;
  var k = Math.min(vw / 1600, vh / 900);
  if (document.body.classList.contains('grid')) k = 1;
  document.querySelectorAll('#deck .stage').forEach(function(st){
    if (document.body.classList.contains('grid')){
      var box = st.parentElement.clientWidth / 1600;
      st.style.transformOrigin = 'top left';
      st.style.transform = 'scale(' + box + ')';
      st.style.position = 'absolute';
    } else {
      st.style.transformOrigin = 'center center';
      st.style.position = 'relative';
      st.style.transform = 'scale(' + k + ')';
    }
  });
}

function show(i){
  idx = Math.max(0, Math.min(TOTAL - 1, i));
  var wraps = document.querySelectorAll('#deck .sheetwrap');
  for (var j = 0; j < wraps.length; j++) wraps[j].classList.toggle('on', j === idx);
  document.getElementById('hud').textContent = pad(idx+1) + ' / ' + pad(TOTAL);
  document.getElementById('pcount').textContent = pad(idx+1) + ' / ' + pad(TOTAL);
  document.getElementById('pbar').style.width =
    (TOTAL > 1 ? (idx / (TOTAL - 1)) * 100 : 100) + '%';
  if (history.replaceState) history.replaceState(null, '', '#s' + pad(idx+1));
}

/* ======================================================================
   PRESENTER. Elapsed clock, blank, and a corner chip that is SUMMONED
   rather than automatic.
   ================================================================== */
var PRESENT = document.documentElement.dataset.present === '1';
var pchrome = document.getElementById('pchrome');
var pclock  = document.getElementById('pclock');
var blankEl = document.getElementById('blankout');
var idleT = null, t0 = null, tickT = null;

function bump(hold){
  pchrome.classList.add('show');
  clearTimeout(idleT);
  if (hold === true) return;              /* held open on purpose */
  /* The running timer must NOT pin the chip open. This is a single screen
     deck: whatever sits in the corner is burned onto the wall the room is
     looking at for as long as it stays there. The clock keeps ticking behind
     the fade, because the interval is independent of visibility, and a mouse
     nudge calls bump() again when he wants to read it. */
  idleT = setTimeout(function(){ pchrome.classList.remove('show'); }, 2200);
}
function two(v){ return (v < 10 ? '0' : '') + v; }
function renderClock(){
  if (!t0) return;
  var s = Math.floor((Date.now() - t0) / 1000);
  pclock.textContent = two(Math.floor(s / 60)) + ':' + two(s % 60);
}
function timerToggle(){
  if (t0){
    t0 = null; clearInterval(tickT); tickT = null;
    pclock.classList.add('hide'); pclock.textContent = '00:00';
  } else {
    t0 = Date.now();
    pclock.classList.remove('hide');
    renderClock();
    tickT = setInterval(renderClock, 1000);
  }
  bump();
}
function timerReset(){ if (t0){ t0 = Date.now(); renderClock(); bump(); } }
function setBlank(mode){
  blankEl.className = 'blankout' + (mode ? (' on' + (mode === 'w' ? ' w' : '')) : '');
}
function blanked(){ return blankEl.classList.contains('on'); }

function build(){
  var html = '';
  SLIDES.forEach(function(s, i){ html += renderSlide(s, i, TOTAL); });
  document.getElementById('deck').innerHTML = html;
  fit();
  relayout();
  var start = 0;
  var m = (location.hash || '').match(/^#s(\d+)$/);
  if (m) start = parseInt(m[1], 10) - 1;
  show(start);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ fit(); relayout(); });
}

document.addEventListener('keydown', function(e){
  var k = e.key;
  /* Any key clears a blanked screen first, so he can never be stuck dark. */
  if (blanked() && k !== 'b' && k !== 'B' && k !== 'w' && k !== 'W'){ setBlank(null); e.preventDefault(); return; }
  if (PRESENT && (k === 't' || k === 'T')){ timerToggle(); e.preventDefault(); return; }
  if (PRESENT && (k === 'r' || k === 'R')){ timerReset(); e.preventDefault(); return; }
  if (PRESENT && (k === 'b' || k === 'B')){ setBlank(blanked() ? null : 'b'); e.preventDefault(); return; }
  if (PRESENT && (k === 'w' || k === 'W')){ setBlank(blanked() ? null : 'w'); e.preventDefault(); return; }
  if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'ArrowDown'){ show(idx + 1); e.preventDefault(); }
  else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'ArrowUp'){ show(idx - 1); e.preventDefault(); }
  else if (k === 'Home'){ show(0); e.preventDefault(); }
  else if (k === 'End'){ show(TOTAL - 1); e.preventDefault(); }
  else if (k === 'f' || k === 'F'){
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  }
  else if (k === 'g' || k === 'G'){
    /* Only the transform changes. relayout() must NOT run here: in the contact
       sheet every stage is scaled to about a quarter, and re-measuring panels
       at that scale collapsed them, so sheets past the fourth row came out
       empty. The layout is already correct from the full size pass. */
    document.body.classList.toggle('grid');
    fit();
  }
  else if (k === 'c' || k === 'C'){ document.body.classList.toggle('hidechrome'); }
});
window.addEventListener('resize', function(){ fit(); relayout(); });
/* A nudge is how he asks to see the clock. Nothing else summons it. */
document.addEventListener('mousemove', function(){ if (PRESENT) bump(); }, {passive:true});
/* The contact sheet doubles as the jump list: click a sheet, land on it. */
document.getElementById('deck').addEventListener('click', function(e){
  if (!document.body.classList.contains('grid')) return;
  var w = e.target.closest('.sheetwrap');
  if (!w) return;
  var all = [].slice.call(document.querySelectorAll('#deck .sheetwrap'));
  document.body.classList.remove('grid');
  fit(); show(all.indexOf(w));
});
build();
</script>
