<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>Absorb Triage Board</title>
<link rel="icon" type="image/svg+xml" href="https://agentshq.boubacarbarry.com/atlas/compass.svg">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#0d1117;color:#c9d1d9;font-family:system-ui,-apple-system,sans-serif;font-size:13px;min-height:100vh}
header{background:#161b22;border-bottom:1px solid #30363d;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
h1{font-size:15px;font-weight:600;color:#f0f6fc}
.meta{color:#8b949e;font-size:12px}
.head-spacer{margin-left:auto}
nav.tnav{display:flex;gap:4px;flex-wrap:wrap}
nav.tnav a{color:#8b949e;font-size:12px;text-decoration:none;font-family:ui-monospace,Menlo,monospace;padding:5px 10px;border:1px solid transparent;border-radius:6px;transition:all .12s;white-space:nowrap}
nav.tnav a:hover{color:#c9d1d9;border-color:#30363d}
nav.tnav a.here{color:#58a6ff;border-color:#0d419d}
.toolbar{background:#0d1117;border-bottom:1px solid #30363d;padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar input{flex:1 1 220px;min-width:0;padding:7px 12px;border:1px solid #30363d;border-radius:6px;font-size:13px;background:#161b22;color:#c9d1d9}
.toolbar input:focus{outline:none;border-color:#58a6ff}
.btn{background:#21262d;border:1px solid #30363d;color:#c9d1d9;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;transition:background .15s}
.btn:hover{background:#30363d}
.btn-primary{background:#238636;border-color:#2ea043;color:#fff}
.btn-primary:hover{background:#2ea043}
.btn-danger{background:#21262d;border:1px solid #f85149;color:#ffa198}
.btn-danger:hover{background:#3d1418}
.btn-sm{padding:4px 9px;font-size:11px;border-radius:5px}
.stats{padding:8px 16px;font-size:12px;color:#8b949e;display:flex;gap:14px;flex-wrap:wrap;background:#0d1117;border-bottom:1px solid #21262d}
.stats .stat{display:inline-flex;align-items:center;gap:5px;cursor:pointer;padding:3px 8px;border:1px solid transparent;border-radius:6px;transition:border-color .12s,background .12s}
.stats .stat:hover{border-color:#30363d}
.stats .stat.active{border:2px solid #58a6ff;background:#0d419d22;padding:2px 7px}
.stats .dot{display:inline-block;width:8px;height:8px;border-radius:50%}
.dot.today{background:#3fb950}
.dot.later{background:#d29922}
.dot.skip{background:#6e7681}
.dot.unset{background:#21262d;border:1px solid #6e7681}

/* --- Section shells (Active / Archived / Done) --- */
.section{margin:0 16px 14px;border:1px solid #30363d;border-radius:8px;background:#0d1117}
.section > summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;align-items:center;gap:10px;background:#161b22;border-radius:8px;user-select:none}
.section > summary::-webkit-details-marker{display:none}
.section > summary .chev{font-size:11px;color:#8b949e;transition:transform .15s;display:inline-block}
.section[open] > summary .chev{transform:rotate(90deg)}
.section[open] > summary{border-radius:8px 8px 0 0;border-bottom:1px solid #30363d}
.section-title{font-weight:600;font-size:13px;color:#f0f6fc}
.section-count{background:#30363d;color:#c9d1d9;font-size:11px;padding:2px 8px;border-radius:10px}
.section-sub{color:#6e7681;font-size:11px;margin-left:2px}
.section-sub-note{color:#6e7681;font-size:11.5px;padding:8px 16px 0}
#sec-active > summary{border-top:3px solid #3fb950;padding-top:9px}
#sec-archived > summary{border-top:3px solid #bc8cff;padding-top:9px}
#sec-done > summary{border-top:3px solid #58a6ff;padding-top:9px}

.board{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:16px;min-height:200px}
.col{background:#161b22;border:1px solid #30363d;border-radius:8px;display:flex;flex-direction:column;min-height:300px}
.col-header{padding:10px 12px;border-bottom:1px solid #30363d;display:flex;align-items:center;gap:8px;position:sticky;top:0;background:#161b22;z-index:2;border-radius:8px 8px 0 0}
.col-title{font-weight:600;font-size:13px}
.col-count{background:#30363d;color:#8b949e;font-size:11px;padding:1px 6px;border-radius:10px}
#col-today .col-header{border-top:3px solid #3fb950}
#col-later .col-header{border-top:3px solid #d29922}
#col-skip .col-header{border-top:3px solid #6e7681}
.col-body{padding:8px;display:flex;flex-direction:column;gap:8px;flex:1;overflow-y:auto;min-height:100px}
.col-body.drag-over{background:#1c2128}
.card{background:#21262d;border:1px solid #30363d;border-radius:6px;padding:10px;cursor:grab;user-select:none;transition:box-shadow .15s,opacity .15s,border-color .15s;border-left:3px solid #6e7681}
.card.today{border-left-color:#3fb950}
.card.later{border-left-color:#d29922}
.card.skip{border-left-color:#6e7681;opacity:.7}
.card:hover{border-color:#58a6ff;box-shadow:0 0 0 1px #58a6ff22}
.card.dragging{opacity:.4;cursor:grabbing}
.card.flash{border-color:#3fb950 !important;box-shadow:0 0 0 2px #3fb95066 !important}
.card.archiving{opacity:0;transform:scale(.96);transition:opacity .25s,transform .25s}
.card-idrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.card-id{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#8b949e}
.card-placement{font-family:ui-monospace,monospace;font-size:10px;color:#58a6ff;background:#0d419d22;padding:2px 7px;border-radius:4px}
.card-target{font-size:12.5px;color:#f0f6fc;font-weight:600;margin-bottom:4px;word-break:break-word}
.card-url{display:block;font-size:11px;color:#58a6ff;word-break:break-all;margin-bottom:8px;text-decoration:none;padding:2px 0}
.card-url:hover{text-decoration:underline}
.annot{display:inline-block;font-size:10px;background:#bc8cff22;color:#bc8cff;border-radius:4px;padding:2px 7px;margin:0 0 6px}
.sec{margin:7px 0}
.sec .sec-h{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin-bottom:3px}
.sec.what .sec-h{color:#58a6ff}
.sec.why-sec .sec-h{color:#3fb950}
.sec.worry .sec-h{color:#f0883e}
.sec.judge .sec-h{color:#d29922}
.sec.decision .sec-h{color:#bc8cff}
.sec.shipped .sec-h{color:#58a6ff}
.sec p,.sec li{font-size:12px;color:#c9d1d9;line-height:1.45;word-break:break-word}
.sec ul{margin:0;padding-left:16px}
.sec.worry li{color:#e0a07a}
.card-next{font-size:12.5px;color:#c9d1d9;margin:8px 0;white-space:pre-wrap;word-break:break-word;line-height:1.45}
.approve-btn{width:100%;background:#238636;border:1px solid #2ea043;color:#fff;padding:8px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;margin:6px 0;transition:background .15s}
.approve-btn:hover{background:#2ea043}
.card-actions{display:flex;gap:6px;margin:6px 0}
.card-actions button{flex:1}
.note-box{width:100%;margin-top:6px;padding:8px 10px;border:1px solid #30363d;border-radius:6px;font:12px/1.4 system-ui,sans-serif;color:#c9d1d9;background:#0d1117;resize:vertical;min-height:36px}
.note-box:focus{outline:none;border-color:#d29922;background:#161b22}
.note-box::placeholder{color:#6e7681}
.bucket-row{display:flex;gap:6px;margin-top:8px}
.bucket-row button{flex:1;padding:7px 6px;border:1px solid #30363d;background:#161b22;color:#8b949e;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer}
.bucket-row button.active.today{background:#238636;color:#fff;border-color:#2ea043}
.bucket-row button.active.later{background:#9e6a02;color:#fff;border-color:#d29922}
.bucket-row button.active.skip{background:#484f58;color:#fff;border-color:#6e7681}
.empty{text-align:center;color:#6e7681;padding:40px 20px;font-size:13px}

/* --- Archived / Done flat lists (read-only reference cards) --- */
.flat-list{padding:12px 16px;display:flex;flex-direction:column;gap:8px;max-height:520px;overflow-y:auto}
.ref-card{background:#161b22;border:1px solid #30363d;border-radius:6px;padding:10px 12px;border-left:3px solid #6e7681}
.ref-card.verdict-archive{border-left-color:#bc8cff}
.ref-card.verdict-dontproceed{border-left-color:#f85149}
.ref-card.verdict-deferred{border-left-color:#6e7681}
.ref-card.manual-archive{border-left-color:#d29922}
.ref-card.shipped{border-left-color:#58a6ff}
.verdict-badge{font-family:ui-monospace,monospace;font-size:10px;padding:2px 7px;border-radius:4px;background:#21262d;color:#8b949e}
.load-more-note{text-align:center;color:#6e7681;font-size:11.5px;padding:6px 0 4px}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#238636;color:#fff;padding:10px 18px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:100}
.toast.show{opacity:1}
.btn-bulk{background:#9e6a02;border:1px solid #d29922;color:#fff;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;transition:background .15s}
.btn-bulk:hover{background:#d29922}
#back-to-top{position:fixed;bottom:24px;right:24px;width:44px;height:44px;border-radius:50%;background:#238636;color:#fff;border:none;font-size:20px;cursor:pointer;opacity:0;transition:opacity .2s;z-index:1000}
#back-to-top.visible{opacity:1}
@media(max-width:820px){.board{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div>
    <h1>Absorb Triage Board</h1>
    <div class="meta" id="meta-line">Loading...</div>
  </div>
  <nav class="tnav head-spacer">
    <a href="https://agentshq.boubacarbarry.com/atlas">Dashboard</a>
    <a href="https://agentshq.boubacarbarry.com/atlas/roadmap">Roadmap</a>
    <a href="https://agentshq.boubacarbarry.com/atlas/queue">Queue</a>
    <a href="https://agentshq.boubacarbarry.com/atlas/absorb-triage" class="here">Absorb</a>
    <a href="https://agentshq.boubacarbarry.com/atlas/cost">Spend</a>
    <a href="https://agentshq.boubacarbarry.com/atlas/lessons">Lessons</a>
    <a href="https://agentshq.boubacarbarry.com/atlas/lighthouse">Lighthouse</a>
  </nav>
</header>

<div class="toolbar">
  <input id="filter" type="text" placeholder="Filter Active by ID, target, reason, URL..." autocomplete="off">
  <button class="btn-bulk" id="assign-all-later">↓ All Active → LATER</button>
  <button class="btn" id="clear-state">Reset</button>
  <button class="btn" id="copy-markdown">Copy markdown</button>
  <button class="btn btn-primary" id="paste-back">Paste decisions to chat</button>
  <button class="btn" id="expand-all">Expand all</button>
  <button class="btn" id="collapse-all">Collapse all</button>
</div>

<div class="stats" id="stats"></div>

<details class="section" id="sec-active" open>
  <summary>
    <span class="chev">&#9656;</span>
    <span class="section-title">Active</span>
    <span class="section-count" id="cnt-active-section">0</span>
    <span class="section-sub">-- needs your judgment call now</span>
  </summary>
  <div class="board">
    <div class="col" id="col-today">
      <div class="col-header">
        <span class="col-title">TODAY</span>
        <span class="col-count" id="cnt-today">0</span>
      </div>
      <div class="col-body" id="body-today" data-bucket="today" ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event,'today')"></div>
    </div>
    <div class="col" id="col-later">
      <div class="col-header">
        <span class="col-title">LATER</span>
        <span class="col-count" id="cnt-later">0</span>
      </div>
      <div class="col-body" id="body-later" data-bucket="later" ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event,'later')"></div>
    </div>
    <div class="col" id="col-skip">
      <div class="col-header">
        <span class="col-title">SKIP</span>
        <span class="col-count" id="cnt-skip">0</span>
      </div>
      <div class="col-body" id="body-skip" data-bucket="skip" ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event,'skip')"></div>
    </div>
  </div>
</details>

<details class="section" id="sec-archived">
  <summary>
    <span class="chev">&#9656;</span>
    <span class="section-title">Archived</span>
    <span class="section-count" id="cnt-archived-section">0</span>
    <span class="section-sub">-- reviewed / decided, kept for reference (never deleted)</span>
  </summary>
  <div class="section-sub-note" id="archived-note"></div>
  <div class="flat-list" id="archived-list"></div>
</details>

<details class="section" id="sec-done">
  <summary>
    <span class="chev">&#9656;</span>
    <span class="section-title">Done / Shipped</span>
    <span class="section-count" id="cnt-done-section">0</span>
    <span class="section-sub">-- already implemented and landed</span>
  </summary>
  <div class="section-sub-note" id="done-note"></div>
  <div class="flat-list" id="done-list"></div>
</details>

<div class="toast" id="toast"></div>
<button id="back-to-top" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="Back to top">↑</button>

<script>
// CONFIG
const STORAGE_KEY = "absorb_triage_state_v1";
const NOTES_KEY = "absorb_triage_notes_v1";
const SECTIONS_KEY = "absorb_triage_sections_v1";
const ORC_BASE = "https://agentshq.boubacarbarry.com/api/orc";

let ITEMS = [];        // Active items
let ARCHIVED = [];     // Archived reference items
let ARCHIVED_TOTAL = 0;
let DONE = [];         // Done/shipped reference items
let DONE_TOTAL = 0;
let STATE = {};
let NOTES = {};
let FILTER = "";
let activeFilter = null;
let dragCard = null;

try { STATE = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); } catch (e) { STATE = {}; }
try { NOTES = JSON.parse(localStorage.getItem(NOTES_KEY) || "{}"); } catch (e) { NOTES = {}; }

// Restore section open/closed state (defaults: Active open, others closed --
// set via the `open` attribute already on #sec-active in the markup above).
try {
  const sectionState = JSON.parse(localStorage.getItem(SECTIONS_KEY) || "{}");
  for (const id of ["sec-active", "sec-archived", "sec-done"]) {
    if (id in sectionState) {
      const el = document.getElementById(id);
      if (el) el.open = !!sectionState[id];
    }
  }
} catch (e) { /* ignore, defaults stand */ }

for (const id of ["sec-active", "sec-archived", "sec-done"]) {
  const el = document.getElementById(id);
  el.addEventListener("toggle", () => {
    let sectionState = {};
    try { sectionState = JSON.parse(localStorage.getItem(SECTIONS_KEY) || "{}"); } catch (e) {}
    sectionState[id] = el.open;
    localStorage.setItem(SECTIONS_KEY, JSON.stringify(sectionState));
  });
}

document.getElementById("expand-all").addEventListener("click", () => {
  for (const id of ["sec-active", "sec-archived", "sec-done"]) document.getElementById(id).open = true;
});
document.getElementById("collapse-all").addEventListener("click", () => {
  for (const id of ["sec-active", "sec-archived", "sec-done"]) document.getElementById(id).open = false;
});

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }
  catch (e) { showToast("State save failed"); }
}

// Persist a triage decision to the DB (fire-and-forget). Board buckets are
// lowercase today/later/skip; the API expects uppercase TODAY/LATER/SKIP,
// and null clears the decision (card back to Untriaged).
const BUCKET_TO_STATUS = { today: "TODAY", later: "LATER", skip: "SKIP" };
function pushTriage(itemId, bucket) {
  const status = BUCKET_TO_STATUS[bucket] || null;
  fetch(ORC_BASE + "/atlas/absorb-triage-items/" + itemId + "/triage", {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ status: status }),
  }).catch(err => console.warn("triage save failed:", err));
}
function saveNotes() {
  try { localStorage.setItem(NOTES_KEY, JSON.stringify(NOTES)); }
  catch (e) { showToast("Note save failed"); }
}

const _noteTimers = {};
function pushNote(itemId, note) {
  clearTimeout(_noteTimers[itemId]);
  _noteTimers[itemId] = setTimeout(() => {
    fetch(ORC_BASE + "/atlas/absorb-triage-items/" + itemId + "/note", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ note: note || null }),
    }).catch(err => console.warn("note save failed:", err));
  }, 600);
}

function pushArchive(itemId, reason) {
  return fetch(ORC_BASE + "/atlas/absorb-triage-items/" + itemId + "/archive", {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ reason: reason || null }),
  });
}

function pushUnarchive(itemId) {
  return fetch(ORC_BASE + "/atlas/absorb-triage-items/" + itemId + "/unarchive", { method: "PUT" });
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1800);
}

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s == null ? "" : String(s);
  return d.innerHTML;
}

// ACTIVE CARD RENDER
function buildCard(item) {
  const bucket = STATE[item.id] || "";
  const card = document.createElement("div");
  card.className = "card" + (bucket ? " " + bucket : "");
  card.draggable = true;
  card.dataset.id = item.id;

  const idRow = document.createElement("div");
  idRow.className = "card-idrow";
  const idEl = document.createElement("span");
  idEl.className = "card-id";
  idEl.textContent = "#" + item.id;
  const placeEl = document.createElement("span");
  placeEl.className = "card-placement";
  placeEl.textContent = (item.placement || "?") + " | " + (item.leverage || "?");
  idRow.appendChild(idEl);
  idRow.appendChild(placeEl);
  card.appendChild(idRow);

  if (item.placement_target) {
    const tgt = document.createElement("div");
    tgt.className = "card-target";
    tgt.textContent = item.placement_target;
    card.appendChild(tgt);
  }

  if (item.url) {
    const a = document.createElement("a");
    a.className = "card-url";
    a.href = item.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.textContent = item.url;
    a.addEventListener("mousedown", e => e.stopPropagation());
    card.appendChild(a);
  }

  const noteIdx = (item.submitted_by || "").indexOf("note=");
  if (noteIdx !== -1) {
    const an = document.createElement("span");
    an.className = "annot";
    an.textContent = "your note: " + item.submitted_by.slice(noteIdx + 5).replace(/-/g, " ");
    card.appendChild(an);
  }

  function section(cls, heading, bodyText, bodyList) {
    if (!bodyText && !(bodyList && bodyList.length)) return;
    const s = document.createElement("div");
    s.className = "sec " + cls;
    const h = document.createElement("div");
    h.className = "sec-h";
    h.textContent = heading;
    s.appendChild(h);
    if (bodyList && bodyList.length) {
      const ul = document.createElement("ul");
      for (const li of bodyList) {
        const el = document.createElement("li");
        el.textContent = li;
        ul.appendChild(el);
      }
      s.appendChild(ul);
    } else {
      const p = document.createElement("p");
      p.textContent = bodyText;
      s.appendChild(p);
    }
    card.appendChild(s);
  }

  section("what", "What it is", item.dossier_summary, null);
  section("why-sec", "Why it enhances us", null, item.why);
  const worries = (item.worries || []).concat(item.security_flags || []);
  if (!worries.length && item.runner_up_reason && item.runner_up_reason !== "n/a") {
    worries.push("Rejected alternative: " + item.runner_up_reason);
  }
  section("worry", "Worries / cons", null, worries);
  if (item.why_review && item.why_review !== "n/a") {
    section("judge", "Your call needed on", item.why_review, null);
  }

  if (item.next_action) {
    const reason = document.createElement("div");
    reason.className = "card-next";
    reason.textContent = item.next_action;
    card.appendChild(reason);
  }

  const actionRow = document.createElement("div");
  actionRow.className = "card-actions";

  const approve = document.createElement("button");
  approve.className = "approve-btn";
  approve.textContent = "✓ Approve & Copy";
  approve.addEventListener("click", () => approveAndCopy(item, card));
  card.appendChild(approve);

  const archiveBtn = document.createElement("button");
  archiveBtn.className = "btn btn-sm";
  archiveBtn.style.width = "100%";
  archiveBtn.textContent = "Archive (decided, keep for reference)";
  archiveBtn.addEventListener("click", () => archiveItem(item, card));
  card.appendChild(archiveBtn);

  const row = document.createElement("div");
  row.className = "bucket-row";
  for (const b of ["today", "later", "skip"]) {
    const btn = document.createElement("button");
    btn.textContent = b.toUpperCase();
    if (bucket === b) btn.className = "active " + b;
    btn.addEventListener("click", () => {
      STATE[item.id] = (STATE[item.id] === b) ? "" : b;
      saveState();
      render();
    });
    row.appendChild(btn);
  }
  card.appendChild(row);

  const note = document.createElement("textarea");
  note.className = "note-box";
  note.rows = 1;
  note.placeholder = "Note for the agent (optional): why, scope tweak, do-this-instead... (also used as the Archive reason)";
  note.value = NOTES[item.id] || "";
  note.addEventListener("mousedown", e => e.stopPropagation());
  note.addEventListener("input", () => {
    const v = note.value.trim();
    if (v) NOTES[item.id] = v; else delete NOTES[item.id];
    saveNotes();
    pushNote(item.id, v || null);
  });
  card.appendChild(note);

  card.addEventListener("dragstart", e => {
    dragCard = item.id;
    card.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
  });
  card.addEventListener("dragend", () => {
    card.classList.remove("dragging");
    dragCard = null;
  });

  return card;
}

// ARCHIVE ACTION -- moves a card from Active to Archived (never deletes).
function archiveItem(item, cardEl) {
  const reason = NOTES[item.id] || "";
  if (!confirm("Archive #" + item.id + "? It moves out of Active into Archived (kept for reference, never deleted). You can Unarchive it later.")) return;
  cardEl.classList.add("archiving");
  pushArchive(item.id, reason)
    .then(r => {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(() => {
      ITEMS = ITEMS.filter(it => it.id !== item.id);
      ARCHIVED.unshift({
        id: item.id,
        url: item.url,
        placement: item.placement,
        placement_target: item.placement_target,
        leverage: item.leverage,
        verdict: "PROCEED",
        dossier_summary: item.dossier_summary,
        why: item.why,
        worries: item.worries,
        why_review: item.why_review,
        runner_up_reason: item.runner_up_reason,
        archived_at: new Date().toISOString(),
        archived_reason: reason,
        ts_processed: item.ts_processed,
      });
      ARCHIVED_TOTAL += 1;
      showToast("Archived #" + item.id);
      render();
      renderArchived();
    })
    .catch(err => {
      cardEl.classList.remove("archiving");
      showToast("Archive failed: " + err.message);
    });
}

function unarchiveItem(itemId, cardEl) {
  if (!confirm("Unarchive #" + itemId + "? It moves back into Active.")) return;
  pushUnarchive(itemId)
    .then(r => {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(() => {
      const idx = ARCHIVED.findIndex(it => it.id === itemId);
      if (idx !== -1) {
        ARCHIVED.splice(idx, 1);
        ARCHIVED_TOTAL = Math.max(0, ARCHIVED_TOTAL - 1);
      }
      showToast("Unarchived #" + itemId + " -- reload to see it in Active");
      renderArchived();
    })
    .catch(err => showToast("Unarchive failed: " + err.message));
}

// APPROVE & COPY
function approveAndCopy(item, cardEl) {
  STATE[item.id] = "today";
  saveState();
  pushTriage(item.id, "today");

  const whyStr = (item.why || []).join("; ");
  const note = NOTES[item.id] ? NOTES[item.id].replace(/\s*\n\s*/g, " ") : "";
  const lines = [
    "APPROVE: " + item.id + " — " + (item.placement_target || item.placement || "?"),
    "URL: " + (item.url || "n/a"),
    "Why: " + (whyStr || "n/a"),
    "Next: " + (item.next_action || "n/a"),
    "Notes: " + (note || "(none)"),
  ];
  navigator.clipboard.writeText(lines.join("\n"))
    .then(() => showToast("Approved + copied: #" + item.id))
    .catch(() => showToast("Approved (clipboard blocked)"));

  cardEl.classList.add("flash");
  setTimeout(() => {
    cardEl.classList.remove("flash");
    render();
  }, 1500);
}

// RENDER (Active section)
function render() {
  const bodies = {
    today: document.getElementById("body-today"),
    later: document.getElementById("body-later"),
    skip:  document.getElementById("body-skip"),
  };
  Object.values(bodies).forEach(b => { while (b.firstChild) b.removeChild(b.firstChild); });

  const filter = FILTER.toLowerCase().trim();
  const filtered = ITEMS.filter(it => {
    if (!filter) return true;
    const hay = [it.id, it.url, it.placement, it.placement_target, it.leverage, it.next_action].join(" ").toLowerCase();
    return hay.includes(filter);
  });

  for (const it of filtered) {
    const stateBucket = STATE[it.id] || "unset";
    if (activeFilter && stateBucket !== activeFilter) continue;
    const bucket = STATE[it.id] || "today";
    const body = bodies[bucket] || bodies.today;
    body.appendChild(buildCard(it));
  }

  for (const col of ["today", "later", "skip"]) {
    document.getElementById("cnt-" + col).textContent = bodies[col].querySelectorAll(".card").length;
  }

  if (!filtered.length) {
    const msg = ITEMS.length === 0 ? "No active items. Pile is clear." : "No items match filter.";
    const e1 = document.createElement("div");
    e1.className = "empty";
    e1.textContent = msg;
    bodies.today.appendChild(e1);
  }

  document.getElementById("cnt-active-section").textContent = ITEMS.length;
  renderStats();
}

function renderStats() {
  const counts = { today: 0, later: 0, skip: 0, unset: 0 };
  for (const it of ITEMS) {
    const b = STATE[it.id] || "unset";
    counts[b] = (counts[b] || 0) + 1;
  }
  const stats = document.getElementById("stats");
  while (stats.firstChild) stats.removeChild(stats.firstChild);
  const labels = [
    ["today", counts.today, "TODAY"],
    ["later", counts.later, "LATER"],
    ["skip",  counts.skip,  "SKIP"],
    ["unset", counts.unset, "Untriaged"],
  ];
  for (const [cls, n, lbl] of labels) {
    const stat = document.createElement("span");
    stat.className = "stat" + (activeFilter === cls ? " active" : "");
    stat.title = activeFilter === cls ? "Click to show all" : "Click to show only " + lbl;
    const dot = document.createElement("span");
    dot.className = "dot " + cls;
    stat.appendChild(dot);
    stat.appendChild(document.createTextNode(" " + n + " " + lbl));
    stat.addEventListener("click", () => setFilter(cls));
    stats.appendChild(stat);
  }
}

function setFilter(bucket) {
  activeFilter = (activeFilter === bucket) ? null : bucket;
  render();
}

// DRAG-AND-DROP
function onDragOver(e) { e.preventDefault(); e.currentTarget.classList.add("drag-over"); }
function onDragLeave(e) { e.currentTarget.classList.remove("drag-over"); }
function onDrop(e, targetBucket) {
  e.preventDefault();
  e.currentTarget.classList.remove("drag-over");
  if (!dragCard) return;
  STATE[dragCard] = targetBucket;
  saveState();
  pushTriage(dragCard, targetBucket);
  render();
}

// ARCHIVED / DONE (read-only reference cards)
function verdictClass(v) {
  if (v === "ARCHIVE-AND-NOTE") return "verdict-archive";
  if (v === "DONT_PROCEED") return "verdict-dontproceed";
  if (v === "DEFERRED-UNRESOLVABLE") return "verdict-deferred";
  return "manual-archive"; // manually archived PROCEED item
}

function buildRefCard(item, kind) {
  const card = document.createElement("div");
  card.className = "ref-card " + (kind === "done" ? "shipped" : verdictClass(item.verdict));

  const idRow = document.createElement("div");
  idRow.className = "card-idrow";
  const idEl = document.createElement("span");
  idEl.className = "card-id";
  idEl.textContent = "#" + item.id;
  idRow.appendChild(idEl);

  const badge = document.createElement("span");
  badge.className = "verdict-badge";
  badge.textContent = kind === "done" ? "SHIPPED" : (item.verdict || "ARCHIVED");
  idRow.appendChild(badge);

  const placeEl = document.createElement("span");
  placeEl.className = "card-placement";
  placeEl.textContent = (item.placement || "?") + (item.leverage ? " | " + item.leverage : "");
  idRow.appendChild(placeEl);
  card.appendChild(idRow);

  if (item.placement_target) {
    const tgt = document.createElement("div");
    tgt.className = "card-target";
    tgt.textContent = item.placement_target;
    card.appendChild(tgt);
  }

  if (item.url) {
    const a = document.createElement("a");
    a.className = "card-url";
    a.href = item.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.textContent = item.url;
    card.appendChild(a);
  }

  if (item.dossier_summary) {
    const s = document.createElement("div");
    s.className = "sec what";
    s.innerHTML = '<div class="sec-h">What it is</div><p>' + esc(item.dossier_summary) + '</p>';
    card.appendChild(s);
  }

  if (kind === "archived") {
    if (item.archived_reason) {
      const s = document.createElement("div");
      s.className = "sec decision";
      s.innerHTML = '<div class="sec-h">Why archived</div><p>' + esc(item.archived_reason) + '</p>';
      card.appendChild(s);
    } else if (item.why_review && item.why_review !== "n/a") {
      const s = document.createElement("div");
      s.className = "sec decision";
      s.innerHTML = '<div class="sec-h">Recorded judgment call</div><p>' + esc(item.why_review) + '</p>';
      card.appendChild(s);
    }
    const when = item.archived_at || item.ts_processed;
    if (when) {
      const t = document.createElement("div");
      t.className = "meta";
      t.style.marginTop = "6px";
      t.textContent = (item.archived_at ? "Archived " : "Decided ") + new Date(when).toLocaleDateString();
      card.appendChild(t);
    }
    if (item.archived_at) {
      const btn = document.createElement("button");
      btn.className = "btn btn-sm";
      btn.style.marginTop = "8px";
      btn.textContent = "Unarchive → back to Active";
      btn.addEventListener("click", () => unarchiveItem(item.id, card));
      card.appendChild(btn);
    }
  } else {
    const s = document.createElement("div");
    s.className = "sec shipped";
    const parts = [];
    if (item.shipped_via) parts.push(esc(item.shipped_via));
    if (item.shipped_commits && item.shipped_commits.length) parts.push("commit " + item.shipped_commits.map(esc).join(", "));
    s.innerHTML = '<div class="sec-h">Shipped</div><p>' + (parts.join(" -- ") || "Landed, no note recorded.") + '</p>';
    card.appendChild(s);
    if (item.shipped_at) {
      const t = document.createElement("div");
      t.className = "meta";
      t.style.marginTop = "6px";
      t.textContent = "Shipped " + new Date(item.shipped_at).toLocaleDateString();
      card.appendChild(t);
    }
  }

  return card;
}

function renderArchived() {
  const list = document.getElementById("archived-list");
  while (list.firstChild) list.removeChild(list.firstChild);
  document.getElementById("cnt-archived-section").textContent = ARCHIVED_TOTAL;
  if (!ARCHIVED.length) {
    const e1 = document.createElement("div");
    e1.className = "empty";
    e1.textContent = "Nothing archived yet.";
    list.appendChild(e1);
  } else {
    for (const it of ARCHIVED) list.appendChild(buildRefCard(it, "archived"));
  }
  const note = document.getElementById("archived-note");
  note.textContent = ARCHIVED_TOTAL > ARCHIVED.length
    ? "Showing latest " + ARCHIVED.length + " of " + ARCHIVED_TOTAL + " total archived items."
    : ARCHIVED_TOTAL + " archived item" + (ARCHIVED_TOTAL === 1 ? "" : "s") + ".";
}

function renderDone() {
  const list = document.getElementById("done-list");
  while (list.firstChild) list.removeChild(list.firstChild);
  document.getElementById("cnt-done-section").textContent = DONE_TOTAL;
  if (!DONE.length) {
    const e1 = document.createElement("div");
    e1.className = "empty";
    e1.textContent = "Nothing shipped yet.";
    list.appendChild(e1);
  } else {
    for (const it of DONE) list.appendChild(buildRefCard(it, "done"));
  }
  const note = document.getElementById("done-note");
  note.textContent = DONE_TOTAL > DONE.length
    ? "Showing latest " + DONE.length + " of " + DONE_TOTAL + " total shipped items."
    : DONE_TOTAL + " shipped item" + (DONE_TOTAL === 1 ? "" : "s") + ".";
}

// DATA LOAD
function loadItems() {
  const meta = document.getElementById("meta-line");
  meta.textContent = "Loading...";

  fetch(ORC_BASE + "/atlas/absorb-triage-board")
    .then(r => {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(data => {
      applyActive(data.active || []);
      ARCHIVED = data.archived || [];
      ARCHIVED_TOTAL = data.archived_total || ARCHIVED.length;
      DONE = data.done || [];
      DONE_TOTAL = data.done_total || DONE.length;
      renderArchived();
      renderDone();
      const now = new Date();
      meta.textContent = ITEMS.length + " active | " + ARCHIVED_TOTAL + " archived | " + DONE_TOTAL + " shipped | loaded " + now.toLocaleTimeString();
    })
    .catch(err => {
      // Board endpoint not deployed yet (Gate hasn't merged/pulled it) --
      // fall back to the Active-only endpoint so the page still works.
      console.warn("board endpoint unavailable, falling back to active-only:", err);
      fetch(ORC_BASE + "/atlas/absorb-triage-items")
        .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(data => {
          applyActive(data.items || []);
          ARCHIVED = []; ARCHIVED_TOTAL = 0;
          DONE = []; DONE_TOTAL = 0;
          renderArchived();
          renderDone();
          document.getElementById("archived-note").textContent = "Archived/Done sections need the newer backend endpoint -- pending deploy.";
          document.getElementById("done-note").textContent = "Archived/Done sections need the newer backend endpoint -- pending deploy.";
          const now = new Date();
          meta.textContent = ITEMS.length + " active | loaded " + now.toLocaleTimeString() + " (board endpoint pending deploy)";
        })
        .catch(err2 => {
          meta.textContent = "Load failed: " + err2.message;
          ITEMS = [];
          render();
        });
    });
}

function applyActive(items) {
  ITEMS = items;
  // Restore DB-persisted triage decisions. localStorage wins if it already
  // holds a decision for this id (preserves an unsaved local move); otherwise
  // seed the bucket from item.triage_status (TODAY/LATER/SKIP -> lowercase).
  const STATUS_TO_BUCKET = { TODAY: "today", LATER: "later", SKIP: "skip" };
  let seeded = false;
  for (const it of ITEMS) {
    if (STATE[it.id] === undefined && it.triage_status) {
      const b = STATUS_TO_BUCKET[it.triage_status];
      if (b) { STATE[it.id] = b; seeded = true; }
    }
    // Seed notes from server (server wins; enables cross-device sync).
    if (it.triage_note) NOTES[it.id] = it.triage_note;
  }
  if (seeded) saveState();
  saveNotes();
  render();
}

// MARKDOWN EXPORT
function buildMarkdown() {
  const groups = { today: [], later: [], skip: [], unset: [] };
  for (const it of ITEMS) {
    const b = STATE[it.id] || "unset";
    groups[b].push(it);
  }
  const lines = ["# Absorb triage decisions -- " + new Date().toISOString().slice(0, 10), ""];
  for (const [bucket, arr] of Object.entries(groups)) {
    if (!arr.length) continue;
    lines.push("## " + bucket.toUpperCase() + " (" + arr.length + ")");
    for (const it of arr) {
      const tgt = it.placement_target ? " -> " + it.placement_target : "";
      lines.push("- #" + it.id + " " + (it.placement || "?") + tgt + " | " + (it.next_action || "").split("\n")[0].slice(0, 120));
      if (NOTES[it.id]) lines.push("  - BOUBACAR NOTE: " + NOTES[it.id].replace(/\s*\n\s*/g, " "));
    }
    lines.push("");
  }
  return lines.join("\n");
}

// TOOLBAR WIRING
document.getElementById("filter").addEventListener("input", e => {
  FILTER = e.target.value;
  render();
});

document.getElementById("clear-state").addEventListener("click", () => {
  if (!confirm("Clear all Active triage selections?")) return;
  // Clear DB too, else cleared decisions get re-restored on next load.
  for (const it of ITEMS) {
    if (it.triage_status || STATE[it.id]) pushTriage(it.id, null);
  }
  STATE = {};
  saveState();
  render();
  showToast("State cleared");
});

document.getElementById("copy-markdown").addEventListener("click", () => {
  navigator.clipboard.writeText(buildMarkdown())
    .then(() => showToast("Markdown copied"))
    .catch(() => showToast("Copy failed"));
});

document.getElementById("paste-back").addEventListener("click", () => {
  navigator.clipboard.writeText(buildMarkdown())
    .then(() => showToast("Copied. Paste in chat."))
    .catch(() => showToast("Copy failed"));
});

function assignAllToLater() {
  ITEMS.forEach(item => { STATE[item.id] = "later"; });
  saveState();
  render();
  showToast("All Active items moved to LATER");
}

document.getElementById("assign-all-later").addEventListener("click", assignAllToLater);

window.addEventListener("scroll", () => {
  document.getElementById("back-to-top").classList.toggle("visible", window.scrollY > 300);
});

loadItems();
</script>
