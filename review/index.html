<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Review Queue — boubacarbarry.com</title>
<link rel="icon" href="/favicon.svg">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0b0f17;
    --surface: #141924;
    --border: #1e2840;
    --accent: #3b82f6;
    --text: #e2e8f0;
    --muted: #64748b;
    --green: #22c55e;
    --amber: #f59e0b;
  }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; padding: 2rem 1rem; }
  .container { max-width: 680px; margin: 0 auto; }
  header { margin-bottom: 2.5rem; }
  h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; color: #fff; }
  .subtitle { color: var(--muted); font-size: 0.875rem; margin-top: 0.35rem; }
  .badge { display: inline-block; font-size: 0.7rem; font-weight: 600; padding: 0.2rem 0.5rem; border-radius: 4px; background: rgba(59,130,246,0.15); color: var(--accent); border: 1px solid rgba(59,130,246,0.3); vertical-align: middle; margin-left: 0.5rem; }
  .review-list { display: flex; flex-direction: column; gap: 0.75rem; }
  .review-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1.1rem 1.25rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; text-decoration: none; color: inherit; transition: border-color 0.15s; }
  .review-card:hover { border-color: var(--accent); }
  .review-card .meta { flex: 1; min-width: 0; }
  .review-card .title { font-weight: 600; font-size: 0.975rem; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .review-card .date { font-size: 0.8rem; color: var(--muted); margin-top: 0.2rem; }
  .review-card .arrow { color: var(--muted); flex-shrink: 0; }
  .review-card .arrow svg { width: 18px; height: 18px; }
  .stale .date { color: var(--amber); }
  .empty { text-align: center; padding: 3rem 1rem; color: var(--muted); font-size: 0.9rem; }
  .footer { margin-top: 3rem; font-size: 0.75rem; color: var(--muted); text-align: center; }
  .footer a { color: var(--muted); text-decoration: underline; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Review Queue <span class="badge">PRIVATE</span></h1>
    <p class="subtitle">Ephemeral previews. Not indexed. Pages auto-archive after 14 days inactive or 7 days post-close.</p>
  </header>
  <div class="review-list" id="list">
    <!-- generated by scripts/publish-review.ps1 — do not edit by hand -->
    <a class="review-card" href="/review/sw-geo-opener/">
      <div class="meta">
        <div class="title">SW GEO Opener (dental draft)</div>
        <div class="date">Created 2026-06-09</div>
      </div>
      <div class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></div>
    </a>
  </div>
</div>
<div class="footer">boubacarbarry.com &middot; <a href="/">back to site</a></div>
</body>
</html>
