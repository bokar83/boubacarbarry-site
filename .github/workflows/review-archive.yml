name: Review Hub Daily Archive
# Daily backstop for the 21-day auto-archive sweep. The rebuild script otherwise only runs
# on deploy, so the age-based cutoff needs its own scheduled run for the case where nobody
# pushes to review/ for days. This regenerates the hub (self-populate + auto-archive + prune)
# and commits the result if anything actually changed.
# Archive is move-not-delete: aged pages move to review/archive/ and stay in the repo.
#
# CRON HISTORY -- daily 09:17 UTC -> hourly (6e3ec79, 2026-08-05) -> back to daily (2026-08-06).
#
# The hourly experiment was meant to shrink the window in which review-sync.yml's push gate
# could fail purely because an item had crossed 21 days since the last sweep. It failed on
# both counts and cost more than it bought:
#
#   1. GitHub never honored the hourly schedule on this repo. Observed fire times on the one
#      day it ran: 05:26, 09:04, 11:32, 14:33, 16:59, 18:39 UTC -- gaps of 2h20m to 3h38m,
#      and never at the requested :17. Scheduled workflows are best-effort and get deferred
#      or dropped under load, so "<=1h exposure" was never real; it was ~2-3h.
#   2. It introduced a failure class daily runs had never once produced. Every one of the 30
#      daily sweeps from 2026-07-14 through 2026-08-05 succeeded. Within 17 hours of going
#      hourly, 2 of 7 runs died with "The job was not acquired by Runner of type hosted even
#      after multiple attempts" (runs 31121732763 and 31126196695) -- the job sat in the queue
#      for 15 minutes, never got a runner, produced no logs, and reported a red X. Asking for
#      24x the scheduled runs is a good way to get starved on that queue.
#
# The race itself is now closed properly in review-sync.yml, which runs the mutating rebuild
# and commits it BEFORE its -Check step, so a push can no longer fail on time passing. With
# that in place this sweep is a pure backstop again and daily is the right cadence.
on:
  schedule:
    - cron: '17 9 * * *'   # daily at 09:17 UTC
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: review-archive
  cancel-in-progress: false
jobs:
  archive-sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run rebuild (self-populate + auto-archive)
        shell: pwsh
        run: ./scripts/rebuild-review-index.ps1
      - name: Commit changes if any
        shell: bash
        run: |
          if [ -n "$(git status --porcelain review/)" ]; then
            git config user.name "review-bot"
            git config user.email "review-bot@users.noreply.github.com"
            git add review/
            git commit -m "chore(review): daily auto-archive sweep [skip ci]"
            git push
          else
            echo "No review changes today."
          fi
