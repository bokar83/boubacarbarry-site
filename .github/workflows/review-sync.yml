name: Review Hub Sync Check
# Self-HEALING gate for the review hub. On any push touching review/**, this workflow now
# runs the MUTATING rebuild first (self-populate + 21-day auto-archive + prune), commits
# whatever it had to fix, and only THEN runs -Check to verify the tree is genuinely in sync.
#
# Why heal-then-check instead of check-only (2026-08-06):
# -Check was failing on two different things and treating both as somebody's mistake.
#
#   SELF-POPULATE DRIFT -- a page published without re-running the rebuild, so the folder is
#   on disk but absent from the manifest. Real drift, but trivially self-healable: the
#   rebuild's whole self-populate job is to add exactly that entry.
#   PURE TIME PASSING -- an item crossing the 21-day auto-archive cutoff since the last
#   scheduled sweep. Nobody made a mistake at all and no local action could have prevented
#   it, yet it turned a routine review push red.
#
# 69 of the last 200 Review Hub Sync Check runs failed, spanning 2026-07-21 to 2026-08-06.
# Sampling the failure text: the 26 most recent split 20 time-passing / 6 self-populate,
# while an older slice around 2026-07-21 skews the other way. Both classes are large, and
# BOTH are healed by simply running the rebuild before checking -- which is why widening
# review-archive.yml's cron could never have worked: it does not touch the self-populate half
# at all, and only narrows the other. Real, unhealable drift still fails: the rebuild cannot
# invent a folder a manifest entry points at, and it refuses to write over a corrupted marker
# block rather than emitting a stale hub.
#
# Superseded approach (6e3ec79, reverted in the same commit as this file): widening
# review-archive.yml's cron from daily to hourly only SHRANK the race window instead of
# closing it, and did not reliably do even that -- GitHub does not honor an hourly schedule
# on this repo (observed gaps of 2h20m to 3h38m, never at the requested :17), while 24x the
# scheduled runs bought two "The job was not acquired by Runner of type hosted" infra
# failures inside 17 hours after 30 consecutive clean daily runs. That cron is back to daily,
# where it belongs, now that this workflow closes the race properly.
on:
  push:
    paths:
      - 'review/**'
      - 'scripts/rebuild-review-index.ps1'
      - '.github/workflows/review-sync.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  # Two pushes in quick succession must not both try to heal and push. Queue, never cancel:
  # a cancelled heal would leave the drift it was fixing in place.
  group: review-sync-${{ github.ref }}
  cancel-in-progress: false
jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the branch TIP, not the pushed SHA. The scheduled sweep pushes to the
          # same branch, so the tip is the state that actually needs to be in sync -- and a
          # detached HEAD could not push the heal back.
          ref: ${{ github.ref_name }}
          # Full history so the rebase-retry below actually works. checkout defaults to a
          # depth-1 shallow clone, which has no merge base to rebase onto -- exactly the
          # path that runs when the heal collides with the scheduled sweep. ~123MB / 810
          # commits, a few seconds on a hosted runner, in exchange for a retry that cannot
          # dead-end and hand a routine collision to a human.
          fetch-depth: 0

      - name: Self-heal -- rebuild the hub (self-populate + auto-archive + prune)
        shell: pwsh
        run: ./scripts/rebuild-review-index.ps1

      - name: Commit and push the heal, if it changed anything
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain review/)" ]; then
            echo "Hub was already in sync -- nothing to heal."
            echo "Review hub was already in sync; no heal commit needed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::notice::Review hub was out of sync on push; CI healed it. See the review-bot commit on this branch."
          {
            echo "### Review hub self-healed"
            echo ''
            echo '```'
            git status --porcelain review/
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          git config user.name  "review-bot"
          git config user.email "review-bot@users.noreply.github.com"
          git add review/
          # [skip ci] keeps this push from re-triggering this same workflow.
          git commit -m "chore(review): self-heal hub sync in CI [skip ci]"
          # The daily archive sweep pushes to this branch too. A collision should be a
          # non-event, not a red X -- rebase onto the remote and retry rather than failing.
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Pushed the heal commit on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); rebasing onto origin/${GITHUB_REF_NAME} and retrying."
            if ! git pull --rebase origin "${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              echo "::error::Rebase onto origin/${GITHUB_REF_NAME} conflicted; the heal commit needs a human."
              exit 1
            fi
          done
          echo "::error::Could not push the self-heal commit after 3 attempts."
          exit 1

      - name: Verify review hub is in sync
        shell: pwsh
        run: ./scripts/rebuild-review-index.ps1 -Check

      - name: No placeholder pay links (guard, 2026-07-02)
        shell: pwsh
        run: |
          # A live review page once shipped with buy.stripe.com/REPLACE_WITH_97_LINK
          # on all 3 buy CTAs. Fail the push if any placeholder pay link is present.
          $hits = Get-ChildItem review -Recurse -Include *.html -File |
            Select-String -Pattern 'REPLACE_WITH|buy\.stripe\.com/(PLACEHOLDER|TODO|XXXX|YOUR_)'
          if ($hits) {
            $hits | ForEach-Object { Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
            Write-Error "Placeholder pay link(s) found in review/ — fix before deploy."
            exit 1
          }
          Write-Host "No placeholder pay links in review/."
