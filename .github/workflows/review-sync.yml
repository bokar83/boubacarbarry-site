name: Review Hub Sync Check
# Fails the push if review/index.html or the manifest is out of sync with the review/
# directory, or an item is overdue for the 21-day auto-archive. This is the unskippable
# backstop: even if someone forgets to run the rebuild before deploy, CI catches the drift.
on:
  push:
    paths:
      - 'review/**'
      - 'scripts/rebuild-review-index.ps1'
      - '.github/workflows/review-sync.yml'
  workflow_dispatch:
jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify review hub is in sync
        shell: pwsh
        run: ./scripts/rebuild-review-index.ps1 -Check
      - name: No placeholder pay links (guard, 2026-07-02)
        shell: pwsh
        run: |
          # A live review page once shipped with buy.stripe.com/REPLACE_WITH_97_LINK
          # on all 3 buy CTAs. Fail the push if any placeholder pay link is present.
          $hits = Get-ChildItem review -Recurse -Include *.html -File |
            Select-String -Pattern 'REPLACE_WITH|buy\.stripe\.com/(PLACEHOLDER|TODO|XXXX|YOUR_)'
          if ($hits) {
            $hits | ForEach-Object { Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
            Write-Error "Placeholder pay link(s) found in review/ — fix before deploy."
            exit 1
          }
          Write-Host "No placeholder pay links in review/."
