<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<meta name="robots" content="noindex, follow">
<title>Your kit has moved</title>
<link rel="canonical" href="https://catalystworks.consulting/kit/">
<!-- The .htaccess rule at the site root sends this address on with a 301, so
     in normal operation nobody sees this file at all. It is here for the case
     where that rule is not honoured, and to clean up after the service worker
     that the earlier version of this page registered. -->
<meta http-equiv="refresh" content="0; url=https://catalystworks.consulting/kit/">
<style>
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#EFE7D6;color:#1A1410;padding:32px;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  main{max-width:34rem}
  p{font-size:1.15rem;line-height:1.55;margin:0 0 1.1rem}
  a{color:#B8431A;font-weight:600}
</style>
</head>
<body>
<main>
  <p>Your kit lives at a new address.</p>
  <p><a href="https://catalystworks.consulting/kit/">catalystworks.consulting/kit</a></p>
  <p>You should land there on your own. If nothing happens, the link above will take you.</p>
</main>
<script>
/* Clear up after the previous version of this page before handing the visitor
   on. It registered a service worker and cached itself so it would keep
   working with the wifi down, which was right while this was the live page and
   is wrong now that it is not. */
(function(){
  try {
    if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
      navigator.serviceWorker.getRegistrations().then(function(regs){
        regs.forEach(function(r){ r.unregister(); });
      }).catch(function(){});
    }
    if (window.caches && caches.keys) {
      caches.keys().then(function(keys){
        keys.forEach(function(k){ caches.delete(k); });
      }).catch(function(){});
    }
  } catch(e){}

  /* The meta refresh above covers the no-JavaScript case. This one replaces
     the history entry so the back button does not drop the visitor onto this
     page again and bounce them straight forward. */
  setTimeout(function(){
    location.replace('https://catalystworks.consulting/kit/');
  }, 120);
})();
</script>
</body>
</html>
