  <meta name="robots" content="noindex, follow">
  <!--
    PERMANENT WORKSHOP REDIRECT.
    This one URL (boubacarbarry.com/workshop) is printed on every recording end-card, forever.
    Per new session, change ONLY the TARGET url below and push. Do not rename this file or move it.
    RETARGET, 2026-08-04: now points at /workshop/, the permanent workshop page.
    Every earlier target was a page locked to one past date. Those events are
    over, so the end-card QR and this URL were both delivering people to a page
    selling a session that had already happened. The permanent page hardcodes no
    date: it reads "next session being scheduled" until one is confirmed, then
    shows it. This is the last retarget this file should ever need. If a future
    session needs its own page, change the TARGET below rather than adding a new
    URL, because this address is printed on end-cards that cannot be recalled.

    DO NOT write a past event date or price into this comment. Twice now an
    audit has grepped this file for a date or a dollar amount, matched text
    inside these notes, and concluded the live page was selling a dead event.
    The bytes a grep sees are what an auditor acts on. Retarget history belongs
    in git log, which is where it now lives.

    The redirect carries utm_campaign=ic_workshop_permanent rather than the old
    per-event campaign, so a scan arriving after an event is not counted inside
    that finished campaign. Source, medium and content are unchanged, so
    end-card traffic stays separable from every other channel.
  -->
  <meta http-equiv="refresh" content="0; url=https://catalystworks.consulting/workshop/?utm_source=boubacarbarry&amp;utm_medium=bridge&amp;utm_campaign=ic_workshop_permanent&amp;utm_content=bb_workshop_qr">
  <link rel="canonical" href="https://catalystworks.consulting/workshop/">
  <script>
    // JS fallback in case meta-refresh is blocked.
    window.location.replace("https://catalystworks.consulting/workshop/?utm_source=boubacarbarry&utm_medium=bridge&utm_campaign=ic_workshop_permanent&utm_content=bb_workshop_qr");
  </script>
