<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{PAGE_TITLE}}</title>
<!--
  CANONICAL REVIEW-PAGE TEMPLATE for boubacarbarry.com/review/<slug>/

  Start every review page from this file. It is compliant with the layout hard standard out
  of the box, and scripts/validate-review-page.ps1 (which publish-review.ps1 runs on every
  publish and REFUSES to ship past) is written against exactly this structure.

  THE FIVE RULES, Boubacar verbatim 2026-08-11:
    1. TL;DR at the very top, sections underneath it.
    2. The TL;DR itself is collapsible.
    3. Every section collapsible with a toggle.
    4. A back-to-top button on every page.
    5. Hamburger nav on mobile, normal nav on desktop, floating if practical.

  THE REASON, which matters more than the list:
    "I don't want to have to read 30 pages of a TL;DR to get to the content every single
     time. I need to be able to just quickly jump into this after future reviews."
    => Design for the SECOND visit. Rules 4 and the fold-state memory that makes the second
       visit fast are AUTO-INJECTED at publish time by scripts/inject-review-furniture.ps1,
       so do not hand-roll a back-to-top button here -- you would get two.

  WHAT YOU EDIT: the {{PLACEHOLDERS}}, the nav links, and the <section> blocks. Keep the
  <details><summary><h2>...</h2></summary> shape on every section; that shape IS the check.

  STANDS ALONE ON PURPOSE: no external CSS, no external JS, no fonts, no CDN. He opens these
  on a phone on bad wifi, and a shared include that fails to load would take the furniture
  down with the page. Duplicated bytes are the cheaper trade.
-->
<style>
  :root{
    --bg:#0f1115; --bg2:#171a21; --card:#1c202a; --border:#2b3040;
    --text:#e7e9ee; --text-dim:#a7adbb; --accent:#FF8F5E; --accent-visited:#B87333; --accent2:#7fe0b8;
    --warn:#f2b84b; --bad:#ff7a7a; --good:#7fe0b8;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth; scroll-padding-top:76px;}
  body{
    background:var(--bg); color:var(--text); margin:0; line-height:1.55;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    /* Room at the top for the deploy stamp pill, and at the bottom for the floating
       controls, so neither ever sits on top of content. */
    padding:0 0 120px;
  }
  .wrap{max-width:960px; margin:0 auto; padding:0 20px;}

  /* ---- masthead ------------------------------------------------------------------- */
  header.mast{padding:38px 0 14px;}
  header.mast h1{font-size:1.75rem; line-height:1.25; margin:0 0 6px;}
  header.mast .meta{color:var(--text-dim); font-size:.86rem;}

  /* ---- floating nav (rule 5) -------------------------------------------------------
     Floating = position:sticky, which is the practical version of "floating" for a long
     scrolling document: it rides with him without covering anything on the way down. */
  .nav-bar{
    position:sticky; top:0; z-index:50;
    background:rgba(15,17,21,0.93); backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);
    padding:10px 0;
  }
  .nav-inner{max-width:960px; margin:0 auto; padding:0 20px;
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
  .nav-title{font-weight:700; font-size:.9rem; color:var(--text-dim);
    margin-right:auto; letter-spacing:.02em;}
  .nav-links{display:flex; flex-wrap:wrap; gap:8px;}
  .nav-links a{
    color:var(--text); text-decoration:none; font-size:.82rem;
    border:1px solid var(--border); border-radius:999px;
    padding:6px 12px; background:var(--bg2); white-space:nowrap;
  }
  .nav-links a:hover{border-color:var(--accent); color:var(--accent);}
  .nav-toggle{
    display:none; appearance:none; -webkit-appearance:none; cursor:pointer;
    background:var(--bg2); color:var(--text); border:1px solid var(--border);
    border-radius:10px; padding:9px 12px; font-size:1rem; line-height:1;
    min-width:44px; min-height:40px;
  }
  .nav-toggle:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  /* ---- sections (rules 1-3) --------------------------------------------------------- */
  details.sec, details.tldr{
    background:var(--card); border:1px solid var(--border);
    border-radius:12px; margin:18px 0; overflow:hidden;
  }
  details.tldr{border-color:var(--accent); background:var(--bg2);}
  details.sec > summary, details.tldr > summary{
    cursor:pointer; list-style:none; padding:14px 18px;
    display:flex; align-items:center; gap:10px;
    user-select:none;
  }
  details.sec > summary::-webkit-details-marker,
  details.tldr > summary::-webkit-details-marker{display:none;}
  details.sec > summary::before, details.tldr > summary::before{
    content:"\25B8"; color:var(--accent); font-size:.9rem;
    transition:transform .15s ease; flex:none;
  }
  details[open].sec > summary::before, details[open].tldr > summary::before{
    transform:rotate(90deg);
  }
  details.sec > summary h2, details.tldr > summary h2{
    margin:0; font-size:1.12rem; font-weight:650; border:0; padding:0;
  }
  details.tldr > summary h2{color:var(--accent);}
  summary:focus-visible{outline:2px solid var(--accent); outline-offset:-2px;}
  .sec-body{padding:2px 18px 18px; border-top:1px solid var(--border);}
  .sec-body > :first-child{margin-top:14px;}

  /* base link colours -- HARD RULE no-blue-on-dark (2026-07-21, 5th violation 2026-08-25).
     This is the actual source of most live-page violations: every review page starts
     from this template, so a missing/blue base `a{color}` rule here ships on EVERY page
     that does not override it. Fixing it here is the prevention fix, not just a patch. */
  a{color:var(--accent);}
  a:visited{color:var(--accent-visited);}
  a:hover,a:active{color:#FFB08A;}
  p{margin:0 0 12px;}
  ul,ol{margin:0 0 12px; padding-left:22px;}
  li{margin:0 0 6px;}
  code{background:#11141b; border:1px solid var(--border); border-radius:5px;
    padding:1px 5px; font-size:.86em;}
  pre{background:#11141b; border:1px solid var(--border); border-radius:8px;
    padding:12px 14px; overflow-x:auto;}
  table{width:100%; border-collapse:collapse; margin:0 0 14px; font-size:.9rem;}
  th,td{border:1px solid var(--border); padding:8px 10px; text-align:left; vertical-align:top;}
  th{background:var(--bg2); color:var(--text-dim);}
  .table-scroll{overflow-x:auto;}
  footer.foot{color:var(--text-dim); font-size:.8rem; padding:24px 0 10px;
    border-top:1px solid var(--border); margin-top:26px;}

  /* ---- mobile: real hamburger, not a wrapped pill row (rule 5) ---------------------- */
  @media (max-width:768px){
    .nav-toggle{display:inline-flex; align-items:center; justify-content:center;}
    .nav-links{display:none; flex-direction:column; align-items:stretch;
      gap:6px; width:100%; margin-top:10px;}
    .nav-bar.open .nav-links{display:flex;}
    .nav-links a{text-align:left;}
    header.mast h1{font-size:1.4rem;}
    .wrap{padding:0 14px;}
    .nav-inner{padding:0 14px;}
  }

  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    details.sec > summary::before, details.tldr > summary::before{transition:none;}
  }
  @media print{
    .nav-bar{position:static;}
    details{border:0;}
    details > summary::before{display:none;}
  }
</style>
</head>
<body>

<!-- RULE 5: floating (sticky) nav on desktop, real hamburger under 768px. -->
<nav class="nav-bar" id="navBar" aria-label="Section navigation">
  <div class="nav-inner">
    <span class="nav-title">{{NAV_TITLE}}</span>
    <button type="button" class="nav-toggle" id="navToggle"
            aria-expanded="false" aria-controls="navLinks"
            aria-label="Toggle section navigation">&#9776;</button>
    <div class="nav-links" id="navLinks">
      <a href="#tldr">TL;DR</a>
      <a href="#sec-1">{{SECTION_1_NAV}}</a>
      <a href="#sec-2">{{SECTION_2_NAV}}</a>
      <!-- one link per section; keep ids in sync with the <details id="sec-N"> below -->
    </div>
  </div>
</nav>

<div class="wrap">

  <header class="mast">
    <h1>{{PAGE_TITLE}}</h1>
    <div class="meta">{{PAGE_SUBTITLE}} &middot; {{DATE}}</div>
  </header>

  <!-- RULES 1 + 2: TL;DR at the very top, and the TL;DR is ITSELF collapsible.
       `open` so a first-time reader sees it in full. Once he collapses it, the injected
       fold-state memory keeps it collapsed on every later visit to this page, which is the
       whole point: he never scrolls past the same summary twice. -->
  <details class="tldr" id="tldr" open>
    <summary><h2>TL;DR</h2></summary>
    <div class="sec-body">
      {{TLDR_CONTENT}}
    </div>
  </details>

  <!-- RULE 3: EVERY section gets its own toggle. Not one collapsible among several static
       ones -- every single <h2> lives inside a <summary> inside a <details>. -->
  <details class="sec" id="sec-1" open>
    <summary><h2>{{SECTION_1_HEADING}}</h2></summary>
    <div class="sec-body">
      {{SECTION_1_CONTENT}}
    </div>
  </details>

  <details class="sec" id="sec-2" open>
    <summary><h2>{{SECTION_2_HEADING}}</h2></summary>
    <div class="sec-body">
      {{SECTION_2_CONTENT}}
    </div>
  </details>

  <!-- duplicate the <details class="sec"> block per section; add a matching nav link -->

  <footer class="foot">
    {{FOOTER_NOTE}}
  </footer>

</div>

<script>
(function () {
  'use strict';
  // Real hamburger: opens/closes the link list, and closes again on link tap so the menu
  // never sits over the section he just jumped to.
  var navBar = document.getElementById('navBar');
  var navToggle = document.getElementById('navToggle');
  if (navBar && navToggle) {
    navToggle.addEventListener('click', function () {
      var isOpen = navBar.classList.toggle('open');
      navToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    });
    Array.prototype.slice.call(navBar.querySelectorAll('.nav-links a')).forEach(function (a) {
      a.addEventListener('click', function () {
        navBar.classList.remove('open');
        navToggle.setAttribute('aria-expanded', 'false');
      });
    });
  }
  // A nav link must open the section it points at, even if he left it collapsed last visit.
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href^="#"]');
    if (!a) { return; }
    var t = document.getElementById(a.getAttribute('href').slice(1));
    if (t && t.tagName === 'DETAILS') { t.open = true; }
  });
})();
</script>

<!-- scripts/inject-review-furniture.ps1 appends the back-to-top button, the per-page
     fold-state memory and the expand/collapse-all control just above </body> at publish
     time. Do not add your own; you would ship two. -->
</body>
</html>
