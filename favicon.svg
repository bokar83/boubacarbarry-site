<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="The Lamp mark">
  <defs>
    <radialGradient id="lampGlow" cx="50%" cy="42%" r="42%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#fbbf24" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lampFlame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="60%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d9a07e"/>
    </linearGradient>
  </defs>
  <!-- glow halo: light in darkness -->
  <circle cx="32" cy="28" r="26" fill="url(#lampGlow)"/>
  <!-- enclosing ring: the lantern / the world kept lit -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#2ad4df" stroke-width="2.4" stroke-opacity="0.9"/>
  <!-- flame -->
  <path d="M32 16
           C 37 23, 40 27, 40 33
           a 8 8 0 0 1 -16 0
           c 0 -4, 2.4 -7, 4.3 -10
           c 0.6 2.6, 2.2 3.8, 3.4 5.1
           c 1.1 -2.6, 0.7 -5.2, 0.3 -7.1 Z"
        fill="url(#lampFlame)"/>
  <!-- inner flame core -->
  <path d="M32 26 c 2.6 2.6, 3.4 4.6, 3.4 7 a 3.4 3.4 0 0 1 -6.8 0 c 0 -2.3, 1.6 -4.4, 3.4 -7 Z" fill="#10131b" fill-opacity="0.85"/>
  <!-- base line: the ground you build from -->
  <rect x="22" y="46" width="20" height="3" rx="1.5" fill="#d9a07e"/>
</svg>
