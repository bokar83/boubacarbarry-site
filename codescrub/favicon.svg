<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="The Lamp flame">
  <defs>
    <radialGradient id="lampGlow" cx="50%" cy="52%" r="50%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#fbbf24" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lampFlame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff7e0"/>
      <stop offset="40%" stop-color="#fde68a"/>
      <stop offset="78%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#e08a2b"/>
    </linearGradient>
  </defs>
  <!-- TRANSPARENT background: no rect, no badge -->
  <circle cx="32" cy="34" r="27" fill="url(#lampGlow)"/>
  <!-- just the flame, scaled to fill the canvas -->
  <g transform="translate(32 32) scale(1.22) translate(-32 -31)">
    <path d="M32 8
             C 41 22, 47 30, 47 40
             a 15 15 0 0 1 -30 0
             c 0 -7, 4 -12.5, 7.6 -18
             c 1 4.6, 3.8 6.6, 5.9 9
             c 2 -4.6, 1.4 -9.4, 0.5 -13 Z"
          fill="url(#lampFlame)" stroke="#e08a2b" stroke-width="0.6"/>
    <path d="M32 26 c 4.6 4.6, 6 8.2, 6 12.4 a 6 6 0 0 1 -12 0 c 0 -4.2, 2.8 -7.8, 6 -12.4 Z"
          fill="#c2410c" fill-opacity="0.30"/>
  </g>
</svg>
